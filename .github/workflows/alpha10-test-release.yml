name: alpha10 integration prerelease

on:
  push:
    branches:
      - feature/alpha10-roadmap-plugin

permissions:
  contents: write

jobs:
  publish-test-release:
    if: contains(github.event.head_commit.message, '[publish-alpha10-test]')
    runs-on: windows-latest

    env:
      TEST_TAG: v0.3.0-alpha.10-test.6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate compact NavBR app icon
        shell: pwsh
        run: .\scripts\repair-navbr-icon.ps1

      - name: Validate generated multi-resolution icon
        shell: pwsh
        run: |
          $path = Resolve-Path "src/NavBR.Client/Assets/NavBR.ico"
          $bytes = [System.IO.File]::ReadAllBytes($path.Path)
          if ($bytes.Length -lt 64) { throw "Generated icon is unexpectedly small." }
          $reserved = [BitConverter]::ToUInt16($bytes, 0)
          $type = [BitConverter]::ToUInt16($bytes, 2)
          $count = [BitConverter]::ToUInt16($bytes, 4)
          if ($reserved -ne 0 -or $type -ne 1 -or $count -ne 10) {
            throw "Invalid NavBR ICO header: reserved=$reserved type=$type count=$count"
          }
          $sizes = @()
          for ($i = 0; $i -lt $count; $i++) {
            $entry = 6 + (16 * $i)
            $w = [int]$bytes[$entry]
            if ($w -eq 0) { $w = 256 }
            $sizes += $w
          }
          $expected = @(16,20,24,32,40,48,64,96,128,256)
          if (($sizes -join ',') -ne ($expected -join ',')) {
            throw "Unexpected NavBR icon sizes: $($sizes -join ',')"
          }
          Write-Host "Compact NavBR ICO confirmed: $($sizes -join ', ') px"

      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.Server/NavBR.Server.csproj
          dotnet restore src/NavBR.Client/NavBR.Client.csproj -r win-x86
          dotnet restore src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj -r win-x86
          dotnet restore src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj -r win-x86

      - name: Build shared and server
        shell: pwsh
        run: |
          dotnet build src/NavBR.Shared/NavBR.Shared.csproj -c Release --no-restore
          dotnet build src/NavBR.Server/NavBR.Server.csproj -c Release --no-restore

      - name: Publish Native AOT OMSI plugin x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj `
            -c Release `
            -r win-x86 `
            --no-restore `
            -p:PublishAot=true `
            -p:NativeLib=Shared `
            -o artifacts/plugin

          foreach ($required in @(
            "artifacts/plugin/NavBR.OmsiPlugin.dll",
            "artifacts/plugin/NavBR.OmsiPlugin.opl",
            "artifacts/plugin/Install-NavBROmsiPlugin.ps1",
            "artifacts/plugin/Remove-NavBROmsiPlugin.ps1"
          )) {
            if (-not (Test-Path $required)) {
              throw "Native AOT plugin package incomplete: $required"
            }
          }

      - name: Validate Native AOT x86 DLL and OMSI exports
        shell: pwsh
        run: |
          $dll = Resolve-Path "artifacts/plugin/NavBR.OmsiPlugin.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll.Path)
          if ([BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) { throw "Plugin is not PE/MZ." }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550) { throw "Plugin has invalid PE signature." }
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x014C) { throw ("Plugin must be x86/I386; machine=0x{0:X4}" -f $machine) }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vsRoot = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsRoot) { throw "Visual Studio VC tools not found for export validation." }
          $dumpbin = Get-ChildItem (Join-Path $vsRoot "VC/Tools/MSVC") -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x86\\dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe x86 not found." }

          $exports = (& $dumpbin.FullName /nologo /exports $dll.Path) -join "`n"
          foreach ($name in @(
            'PluginStart',
            'PluginFinalize',
            'AccessVariable',
            'AccessTrigger',
            'AccessStringVariable',
            'AccessSystemVariable'
          )) {
            if ($exports -notmatch "(?m)\b$([regex]::Escape($name))\b") {
              throw "Native AOT plugin is missing OMSI export: $name"
            }
          }
          Write-Host "Native AOT plugin validated: x86 + all OMSI exports."

      - name: Smoke-test Native AOT installer without .NET x86
        shell: pwsh
        run: |
          $fakeOmsi = Join-Path $env:RUNNER_TEMP "NavBR-Omsi-Test6"
          if (Test-Path $fakeOmsi) { Remove-Item $fakeOmsi -Recurse -Force }
          New-Item -ItemType Directory -Path $fakeOmsi -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $fakeOmsi "Omsi.exe") -Force | Out-Null

          Remove-Item Env:DOTNET_ROOT_X86 -ErrorAction SilentlyContinue
          Remove-Item 'Env:DOTNET_ROOT(x86)' -ErrorAction SilentlyContinue

          & "artifacts/plugin/Install-NavBROmsiPlugin.ps1" -OmsiRoot $fakeOmsi
          $plugins = Join-Path $fakeOmsi "plugins"
          $manifest = Join-Path $plugins "NavBR.OmsiPlugin.install-manifest.txt"
          foreach ($installed in @(
            $manifest,
            (Join-Path $plugins "NavBR.OmsiPlugin.dll"),
            (Join-Path $plugins "NavBR.OmsiPlugin.opl")
          )) {
            if (-not (Test-Path $installed)) { throw "Native AOT installer did not create: $installed" }
          }

          $manifestText = Get-Content -LiteralPath $manifest -Raw
          if ($manifestText -notmatch 'Native AOT x86') {
            throw "Native AOT deployment was not recorded in manifest."
          }
          if ($manifestText -match 'Microsoft\.NETCore\.App') {
            throw "Manifest still declares an external .NET runtime dependency."
          }

          & "artifacts/plugin/Remove-NavBROmsiPlugin.ps1" -OmsiRoot $fakeOmsi
          foreach ($removed in @(
            $manifest,
            (Join-Path $plugins "NavBR.OmsiPlugin.dll"),
            (Join-Path $plugins "NavBR.OmsiPlugin.opl")
          )) {
            if (Test-Path $removed) { throw "Plugin remover left file behind: $removed" }
          }
          Remove-Item $fakeOmsi -Recurse -Force
          Write-Host "Native AOT install/remove smoke passed without .NET x86 setup."

      - name: Embed Native AOT plugin payload into client
        shell: pwsh
        run: >-
          .\scripts\prepare-embedded-plugin.ps1
          -PluginDirectory "artifacts/plugin"
          -OutputPath "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"

      - name: Build client
        shell: pwsh
        run: dotnet build src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --no-restore

      - name: Validate embedded plugin resource
        shell: pwsh
        run: |
          $assembly = Get-ChildItem "src/NavBR.Client/bin/Release" -Recurse -Filter "OMSI.NavBR.Multiplayer.dll" | Select-Object -First 1
          if (-not $assembly) { throw "NavBR client assembly was not found after build." }
          $bytes = [System.IO.File]::ReadAllBytes($assembly.FullName)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          $resourceName = "NavBR.Client.Assets.NavBROmsiPlugin.bundle.zip"
          if (-not $text.Contains($resourceName)) {
            throw "Client metadata does not contain the embedded OMSI plugin resource."
          }
          Write-Host "Embedded Native AOT plugin resource confirmed."

      - name: Smoke-test bridge x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -o artifacts/bridge-smoke
          & "artifacts/bridge-smoke/NavBR.PluginBridgeSmokeTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Plugin bridge smoke test failed." }

      - name: Publish client x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.Client/NavBR.Client.csproj `
            -c Release -r win-x86 --self-contained true `
            -o artifacts/client

          dotnet publish src/NavBR.Client/NavBR.Client.csproj `
            -c Release -r win-x86 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o artifacts/client-single

      - name: Validate standalone EXE icon resource
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/client-single/OMSI.NavBR.Multiplayer.exe"
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NavBRIconResourceCheck {
            public delegate bool EnumResNameProc(IntPtr h, IntPtr t, IntPtr n, IntPtr p);
            [DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)]
            public static extern IntPtr LoadLibraryEx(string fileName, IntPtr file, uint flags);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool EnumResourceNames(IntPtr module, IntPtr type, EnumResNameProc callback, IntPtr param);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool FreeLibrary(IntPtr module);
          }
          "@
          $module = [NavBRIconResourceCheck]::LoadLibraryEx($exe.Path, [IntPtr]::Zero, 0x00000002)
          if ($module -eq [IntPtr]::Zero) { throw "Could not inspect EXE icon resources." }
          try {
            $script:groups = 0
            $callback = [NavBRIconResourceCheck+EnumResNameProc]{
              param([IntPtr]$h,[IntPtr]$t,[IntPtr]$n,[IntPtr]$p)
              $script:groups++
              return $true
            }
            $null = [NavBRIconResourceCheck]::EnumResourceNames($module, [IntPtr]14, $callback, [IntPtr]::Zero)
            if ($script:groups -lt 1) { throw "Standalone EXE has no RT_GROUP_ICON resource." }
            Write-Host "Standalone EXE icon resource confirmed."
          }
          finally {
            [NavBRIconResourceCheck]::FreeLibrary($module) | Out-Null
          }

      - name: Publish dedicated server
        shell: pwsh
        run: |
          dotnet publish src/NavBR.Server/NavBR.Server.csproj `
            -c Release -r win-x64 --self-contained true `
            -o artifacts/server

      - name: Prepare release assets
        shell: pwsh
        run: |
          $tag = $env:TEST_TAG
          $releaseDir = "artifacts/release"
          $bundleDir = "artifacts/integration-bundle"
          $pluginBundle = Join-Path $bundleDir "Plugin"
          New-Item -ItemType Directory -Force -Path $releaseDir, $pluginBundle | Out-Null

          foreach ($target in @("artifacts/client", "artifacts/server", "artifacts/plugin")) {
            Copy-Item LICENSE (Join-Path $target "LICENSE") -Force
            Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $target "THIRD_PARTY_NOTICES.md") -Force
          }

          $standalone = "artifacts/client-single/OMSI.NavBR.Multiplayer.exe"
          Copy-Item $standalone (Join-Path $releaseDir "OMSI-NavBR-Multiplayer-$tag-win-x86.exe") -Force
          Compress-Archive -Path "artifacts/client/*" -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-Multiplayer-$tag-win-x86.zip") -Force
          Compress-Archive -Path "artifacts/server/*" -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-Server-$tag-win-x64.zip") -Force
          Compress-Archive -Path "artifacts/plugin/*" -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-Plugin-$tag-win-x86.zip") -Force

          Copy-Item $standalone (Join-Path $bundleDir "OMSI.NavBR.Multiplayer.exe") -Force
          Copy-Item "artifacts/plugin/*" $pluginBundle -Recurse -Force
          Copy-Item "docs/ALPHA10_PLUGIN_TEST_CHECKLIST.md" (Join-Path $bundleDir "LEIA-ME-TESTE-ALPHA10.md") -Force
          Copy-Item "docs/REFERENCIAS_OMSILAUNCH_OMSIHOOK.md" (Join-Path $bundleDir "REFERENCIAS-TECNICAS.md") -Force

          @(
            "OMSI NavBR Multiplayer $tag"
            "Integration test prerelease"
            "GitHub SHA: $env:GITHUB_SHA"
            "Generated UTC: $([DateTimeOffset]::UtcNow.ToString('O'))"
            ""
            "TEST.5 permanece preservada como snapshot anterior."
            "TEST.6 usa plugin Native AOT x86 autocontido: nenhum .NET Runtime x86 separado e necessario."
            "O EXE contem o plugin e gerencia instalacao/atualizacao/remocao."
            "A deteccao do OMSI usa processo/caminho conhecido, registro Aerosoft e bibliotecas Steam."
            "O plugin ainda nao cria onibus remoto fisico no OMSI 3D."
          ) | Set-Content -LiteralPath (Join-Path $bundleDir "BUILD-INFO.txt") -Encoding UTF8

          Compress-Archive -Path "$bundleDir/*" `
            -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-alpha10-test.6-integration-win-x86.zip") -Force

          Copy-Item LICENSE (Join-Path $releaseDir "LICENSE") -Force
          Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $releaseDir "THIRD_PARTY_NOTICES.md") -Force

          $hashLines = foreach ($file in Get-ChildItem $releaseDir -File | Sort-Object Name) {
            if ($file.Name -eq "SHA256SUMS.txt") { continue }
            $stream = [System.IO.File]::OpenRead($file.FullName)
            $sha = [System.Security.Cryptography.SHA256]::Create()
            try {
              $hash = ([BitConverter]::ToString($sha.ComputeHash($stream))).Replace('-', '').ToLowerInvariant()
            }
            finally {
              $sha.Dispose()
              $stream.Dispose()
            }
            "$hash  $($file.Name)"
          }
          $hashLines | Set-Content (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

          @"
          # OMSI NavBR Multiplayer $tag

          **PRERELEASE DE TESTE — nao e a alpha.10 final.**

          As `test.1` a `test.5` permanecem publicadas e nao foram sobrescritas.

          ## Test.6

          - novo icone compacto pino laranja + onibus, gerado em 10 resolucoes para Windows;
          - correcao do erro XAML do HUD e validacao automatica de brushes no build;
          - HUD moderno com barra superior translucida;
          - GPS heading-up: onibus sempre para cima e mapa/rota girando;
          - linha, destino e proxima parada fora do mapa;
          - chat acoplado e bloqueio de input do OMSI durante digitacao;
          - setas de manobra quando a geometria permite;
          - atalhos adicionais/configuraveis;
          - `navbr.log` automatico;
          - plugin Native AOT x86 autocontido;
          - **nao exige Microsoft .NET Runtime x86 instalado separadamente**;
          - plugin embutido no proprio EXE;
          - botoes para instalar/atualizar/remover o plugin no NavBR;
          - deteccao automatica do OMSI pelo caminho conhecido, registro Aerosoft e bibliotecas Steam;
          - seletor manual como fallback;
          - arquitetura e proxima pesquisa 3D documentadas com OMSI Launcher e OmsiHook como referencias tecnicas.

          **Fluxo recomendado:** baixe o EXE standalone, abra o NavBR com o OMSI fechado e use `Instalar / atualizar plugin` no painel `PLUGIN BRIDGE v1 • EXP`.

          Resultado esperado depois de instalar e abrir OMSI + NavBR:
          `package=EMBEDDED`, `deployment=NATIVE-AOT-X86`, `install=INSTALLED`, `files=2/2`, `manifest=YES`, `runtime=BUILT-IN`, `status=CONNECTED`, `process-match=YES`, `heartbeat=LIVE`.

          O plugin ainda nao cria nem move onibus fisicos de jogadores remotos no mundo 3D do OMSI.
          "@ | Set-Content "artifacts/release-notes.md" -Encoding UTF8

      - name: Create permanent GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TEST_TAG
          gh release view $tag --repo "${{ github.repository }}" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Prerelease $tag already exists; refusing to overwrite a permanent snapshot."
          }
          $global:LASTEXITCODE = 0
          $assets = Get-ChildItem "artifacts/release" -File | ForEach-Object { $_.FullName }
          $args = @("release", "create", $tag) + $assets + @(
            "--repo", "${{ github.repository }}",
            "--target", "$env:GITHUB_SHA",
            "--title", "OMSI NavBR Multiplayer $tag — integration test",
            "--notes-file", "artifacts/release-notes.md",
            "--prerelease"
          )
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw "Failed to create $tag." }
