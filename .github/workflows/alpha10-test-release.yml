name: alpha10 integration prerelease

on:
  push:
    branches:
      - feature/alpha10-roadmap-plugin

permissions:
  contents: write

jobs:
  publish-test-release:
    if: contains(github.event.head_commit.message, '[publish-alpha10-test]')
    runs-on: windows-latest

    env:
      TEST_TAG: v0.3.0-alpha.10-test.5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate approved NavBR icon source
        shell: pwsh
        run: |
          $expected = "94ac1b5bf0391d1d6c05b1daf4379515cd81aa21"
          $actual = (git hash-object "src/NavBR.Client/Assets/NavBR.ico").Trim()
          if ($actual -ne $expected) {
            throw "Unexpected NavBR icon source. Expected $expected, got $actual."
          }
          Write-Host "Approved NavBR icon source confirmed: $actual"

      - name: Repair multi-resolution app icon
        shell: pwsh
        run: .\scripts\repair-navbr-icon.ps1

      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.Server/NavBR.Server.csproj
          dotnet restore src/NavBR.Client/NavBR.Client.csproj -r win-x86
          dotnet restore src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj -r win-x86
          dotnet restore src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj -r win-x86

      - name: Build plugin x86
        shell: pwsh
        run: |
          dotnet build src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj `
            -c Release -r win-x86 --no-restore -o artifacts/plugin

          foreach ($required in @(
            "artifacts/plugin/NavBR.OmsiPlugin.dll",
            "artifacts/plugin/NavBR.OmsiPlugin.opl",
            "artifacts/plugin/NavBR.OmsiPluginExperimental.dll",
            "artifacts/plugin/NavBR.OmsiPluginExperimental.deps.json",
            "artifacts/plugin/NavBR.OmsiPluginExperimental.runtimeconfig.json",
            "artifacts/plugin/NavBR.Shared.dll",
            "artifacts/plugin/NavBR.Shared.deps.json",
            "artifacts/plugin/Install-NavBROmsiPlugin.ps1",
            "artifacts/plugin/Remove-NavBROmsiPlugin.ps1"
          )) {
            if (-not (Test-Path $required)) { throw "Plugin package incomplete: $required" }
          }

      - name: Embed plugin payload into client
        shell: pwsh
        run: >-
          .\scripts\prepare-embedded-plugin.ps1
          -PluginDirectory "artifacts/plugin"
          -OutputPath "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"

      - name: Smoke-test bridge x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -o artifacts/bridge-smoke
          & "artifacts/bridge-smoke/NavBR.PluginBridgeSmokeTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Plugin bridge smoke test failed." }

      - name: Publish client x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.Client/NavBR.Client.csproj `
            -c Release -r win-x86 --self-contained true `
            -o artifacts/client

          dotnet publish src/NavBR.Client/NavBR.Client.csproj `
            -c Release -r win-x86 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o artifacts/client-single

      - name: Validate embedded plugin resource
        shell: pwsh
        run: |
          $assembly = Resolve-Path "artifacts/client/OMSI.NavBR.Multiplayer.dll"
          $loaded = [System.Reflection.Assembly]::LoadFrom($assembly.Path)
          $resource = $loaded.GetManifestResourceNames() | Where-Object {
            $_ -eq "NavBR.Client.Assets.NavBROmsiPlugin.bundle.zip"
          }
          if (-not $resource) {
            throw "Client does not contain the embedded OMSI plugin payload."
          }
          Write-Host "Embedded plugin payload confirmed."

      - name: Validate standalone EXE icon resource
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/client-single/OMSI.NavBR.Multiplayer.exe"
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NavBRIconResourceCheck {
            public delegate bool EnumResNameProc(IntPtr h, IntPtr t, IntPtr n, IntPtr p);
            [DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)]
            public static extern IntPtr LoadLibraryEx(string fileName, IntPtr file, uint flags);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool EnumResourceNames(IntPtr module, IntPtr type, EnumResNameProc callback, IntPtr param);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool FreeLibrary(IntPtr module);
          }
          "@
          $module = [NavBRIconResourceCheck]::LoadLibraryEx($exe.Path, [IntPtr]::Zero, 0x00000002)
          if ($module -eq [IntPtr]::Zero) { throw "Could not inspect EXE icon resources." }
          try {
            $script:groups = 0
            $callback = [NavBRIconResourceCheck+EnumResNameProc]{
              param([IntPtr]$h,[IntPtr]$t,[IntPtr]$n,[IntPtr]$p)
              $script:groups++
              return $true
            }
            $null = [NavBRIconResourceCheck]::EnumResourceNames($module, [IntPtr]14, $callback, [IntPtr]::Zero)
            if ($script:groups -lt 1) { throw "Standalone EXE has no RT_GROUP_ICON resource." }
            Write-Host "Standalone EXE icon resource confirmed."
          }
          finally {
            [NavBRIconResourceCheck]::FreeLibrary($module) | Out-Null
          }

      - name: Publish dedicated server
        shell: pwsh
        run: |
          dotnet publish src/NavBR.Server/NavBR.Server.csproj `
            -c Release -r win-x64 --self-contained true `
            -o artifacts/server

      - name: Smoke-test plugin installer/remover with .NET 10 x86
        shell: pwsh
        run: |
          $fakeOmsi = Join-Path $env:RUNNER_TEMP "NavBR-Omsi-Test5"
          $dotnetX86 = Join-Path $env:RUNNER_TEMP "NavBR-dotnet-x86-test5"
          $dotnetInstall = Join-Path $env:RUNNER_TEMP "dotnet-install-x86-test5.ps1"
          foreach ($path in @($fakeOmsi, $dotnetX86)) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $dotnetInstall
          & $dotnetInstall -Channel 10.0 -Runtime dotnet -Architecture x86 -InstallDir $dotnetX86 -NoPath
          if (-not (Test-Path (Join-Path $dotnetX86 "dotnet.exe"))) {
            throw "Temporary .NET 10 x86 runtime installation failed."
          }
          $env:DOTNET_ROOT_X86 = $dotnetX86
          New-Item -ItemType Directory -Path $fakeOmsi -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $fakeOmsi "Omsi.exe") -Force | Out-Null
          & "artifacts/plugin/Install-NavBROmsiPlugin.ps1" -OmsiRoot $fakeOmsi
          $manifest = Join-Path $fakeOmsi "plugins/NavBR.OmsiPlugin.install-manifest.txt"
          if (-not (Test-Path $manifest)) { throw "Plugin install smoke test failed." }
          if ((Get-Content $manifest -Raw) -notmatch 'Runtime x86: Microsoft\.NETCore\.App 10\.') {
            throw "Plugin manifest did not record .NET 10 x86."
          }
          & "artifacts/plugin/Remove-NavBROmsiPlugin.ps1" -OmsiRoot $fakeOmsi
          if (Test-Path (Join-Path $fakeOmsi "plugins/NavBR.OmsiPlugin.dll")) {
            throw "Plugin removal smoke test failed."
          }
          Remove-Item $fakeOmsi -Recurse -Force
          Remove-Item $dotnetX86 -Recurse -Force

      - name: Prepare release assets
        shell: pwsh
        run: |
          $tag = $env:TEST_TAG
          $releaseDir = "artifacts/release"
          $bundleDir = "artifacts/integration-bundle"
          $pluginBundle = Join-Path $bundleDir "Plugin"
          New-Item -ItemType Directory -Force -Path $releaseDir, $pluginBundle | Out-Null

          foreach ($target in @("artifacts/client", "artifacts/server", "artifacts/plugin")) {
            Copy-Item LICENSE (Join-Path $target "LICENSE") -Force
            Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $target "THIRD_PARTY_NOTICES.md") -Force
          }

          $standalone = "artifacts/client-single/OMSI.NavBR.Multiplayer.exe"
          Copy-Item $standalone (Join-Path $releaseDir "OMSI-NavBR-Multiplayer-$tag-win-x86.exe") -Force
          Compress-Archive -Path "artifacts/client/*" -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-Multiplayer-$tag-win-x86.zip") -Force
          Compress-Archive -Path "artifacts/server/*" -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-Server-$tag-win-x64.zip") -Force
          Compress-Archive -Path "artifacts/plugin/*" -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-Plugin-$tag-win-x86.zip") -Force

          Copy-Item $standalone (Join-Path $bundleDir "OMSI.NavBR.Multiplayer.exe") -Force
          Copy-Item "artifacts/plugin/*" $pluginBundle -Recurse -Force
          Copy-Item "docs/ALPHA10_PLUGIN_TEST_CHECKLIST.md" (Join-Path $bundleDir "LEIA-ME-TESTE-ALPHA10.md") -Force

          @(
            "OMSI NavBR Multiplayer $tag"
            "Integration test prerelease"
            "GitHub SHA: $env:GITHUB_SHA"
            "Generated UTC: $([DateTimeOffset]::UtcNow.ToString('O'))"
            ""
            "TEST.4 permanece preservada como snapshot anterior."
            "TEST.5 corrige o XAML do HUD e inclui plugin embutido/gerenciado pelo EXE."
            "O plugin ainda nao cria onibus remoto fisico no OMSI."
          ) | Set-Content (Join-Path $bundleDir "BUILD-INFO.txt") -Encoding UTF8

          Compress-Archive -Path "$bundleDir/*" `
            -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-alpha10-test.5-integration-win-x86.zip") -Force

          Copy-Item LICENSE (Join-Path $releaseDir "LICENSE") -Force
          Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $releaseDir "THIRD_PARTY_NOTICES.md") -Force

          $hashLines = foreach ($file in Get-ChildItem $releaseDir -File | Sort-Object Name) {
            if ($file.Name -eq "SHA256SUMS.txt") { continue }
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $hashLines | Set-Content (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

          @"
          # OMSI NavBR Multiplayer $tag

          **PRERELEASE DE TESTE — nao e a alpha.10 final.**

          A `test.4` permanece publicada e nao foi sobrescrita. Esta `test.5` corrige o erro de XAML do HUD identificado no teste real.

          ## Test.5

          - novo icone oficial, com asset de origem validado antes do build;
          - HUD moderno com barra superior translucida;
          - GPS heading-up;
          - linha/destino/proxima parada fora do mapa;
          - chat acoplado e bloqueio de input do OMSI durante digitacao;
          - setas de manobra quando a geometria permite;
          - atalhos adicionais;
          - `navbr.log` automatico;
          - plugin embutido no proprio EXE;
          - botoes para instalar/atualizar/remover o plugin no NavBR;
          - deteccao automatica da pasta do OMSI em outras unidades/bibliotecas Steam;
          - seletor manual somente como fallback;
          - .NET 10 Runtime x86 continua sendo validado antes da instalacao do plugin.

          **Fluxo recomendado:** baixe o EXE standalone, abra o NavBR e use `Instalar / atualizar plugin` no painel `PLUGIN BRIDGE v1 • EXP`.

          Resultado esperado do painel depois de abrir OMSI + NavBR:
          `package=EMBEDDED`, `install=INSTALLED`, `manifest=YES`, `status=CONNECTED`, `process-match=YES`, `heartbeat=LIVE`.

          O plugin ainda nao cria nem move onibus fisicos no mundo 3D do OMSI.
          "@ | Set-Content "artifacts/release-notes.md" -Encoding UTF8

      - name: Create permanent GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TEST_TAG
          gh release view $tag --repo "${{ github.repository }}" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Prerelease $tag already exists; refusing to overwrite a permanent snapshot."
          }
          $global:LASTEXITCODE = 0
          $assets = Get-ChildItem "artifacts/release" -File | ForEach-Object { $_.FullName }
          $args = @("release", "create", $tag) + $assets + @(
            "--repo", "${{ github.repository }}",
            "--target", "$env:GITHUB_SHA",
            "--title", "OMSI NavBR Multiplayer $tag — integration test",
            "--notes-file", "artifacts/release-notes.md",
            "--prerelease"
          )
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw "Failed to create $tag." }
