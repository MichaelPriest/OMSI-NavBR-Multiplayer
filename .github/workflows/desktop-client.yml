name: desktop client

on:
  push:
    branches: [ feature/winui3-app-platform ]
    paths:
      - 'src/NavBR.Client/**'
      - 'src/NavBR.Shared/**'
      - 'src/NavBR.Server/**'
      - 'src/NavBR.OmsiPlugin/**'
      - 'src/NavBR.OpenOmsiPlugin/**'
      - 'src/NavBR.OmsiInterop/**'
      - 'ui/navbr-web/**'
      - 'scripts/prepare-embedded-plugin.ps1'
      - 'scripts/prepare-embedded-openomsi-plugin.ps1'
      - '.github/workflows/desktop-client.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/NavBR.Client/**'
      - 'src/NavBR.Shared/**'
      - 'src/NavBR.Server/**'
      - 'src/NavBR.OmsiPlugin/**'
      - 'src/NavBR.OpenOmsiPlugin/**'
      - 'src/NavBR.OmsiInterop/**'
      - 'ui/navbr-web/**'
      - 'scripts/prepare-embedded-plugin.ps1'
      - 'scripts/prepare-embedded-openomsi-plugin.ps1'
      - '.github/workflows/desktop-client.yml'
  workflow_dispatch:

concurrency:
  group: desktop-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React desktop UI
        shell: pwsh
        run: |
          Push-Location ui/navbr-web
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "NavBR React dependency install failed." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "NavBR React build failed." }
          Pop-Location

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Restore desktop projects
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.OpenOmsiLanSmokeTest/NavBR.OpenOmsiLanSmokeTest.csproj
          dotnet restore src/NavBR.OpenOmsiGatewaySmokeTest/NavBR.OpenOmsiGatewaySmokeTest.csproj
          dotnet restore src/NavBR.Server/NavBR.Server.csproj
          dotnet restore src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj -r win-x86
          dotnet restore src/NavBR.Client/NavBR.Client.csproj -r win-x86

      - name: Smoke-test openOMSI LAN v6 codec
        shell: pwsh
        run: |
          Remove-Item Env:__DOTNET_ADD_32BIT -ErrorAction SilentlyContinue
          Remove-Item Env:__DOTNET_PREFERRED_BITNESS -ErrorAction SilentlyContinue
          & "C:\Program Files\dotnet\dotnet.exe" run `
            --project src/NavBR.OpenOmsiLanSmokeTest/NavBR.OpenOmsiLanSmokeTest.csproj `
            -c Release `
            --no-restore
          if ($LASTEXITCODE -ne 0) { throw "openOMSI LAN v6 codec smoke failed." }

      - name: Smoke-test openOMSI loopback gateway
        shell: pwsh
        run: |
          Remove-Item Env:__DOTNET_ADD_32BIT -ErrorAction SilentlyContinue
          Remove-Item Env:__DOTNET_PREFERRED_BITNESS -ErrorAction SilentlyContinue
          & "C:\Program Files\dotnet\dotnet.exe" run `
            --project src/NavBR.OpenOmsiGatewaySmokeTest/NavBR.OpenOmsiGatewaySmokeTest.csproj `
            -c Release `
            --no-restore
          if ($LASTEXITCODE -ne 0) { throw "openOMSI loopback gateway smoke failed." }

      - name: Build native OMSI interop x86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/interop" | Out-Null
          cl /nologo /LD /O2 /EHsc /DWIN32_LEAN_AND_MEAN `
            native/NavBR.OmsiInterop/NavBROmsiInterop.cpp `
            native/NavBR.OmsiInterop/NavBROmsiInteropState.cpp `
            /link `
            /DEF:native/NavBR.OmsiInterop/NavBROmsiInterop.def `
            /OUT:artifacts/interop/NavBR.OmsiInterop.dll
          if ($LASTEXITCODE -ne 0) { throw "Native OMSI interop build failed." }

      - name: Publish OMSI plugin x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj `
            -c Release `
            -r win-x86 `
            --no-restore `
            -p:PublishAot=true `
            -p:NativeLib=Shared `
            -o artifacts/NavBR.OmsiPlugin.Experimental

          Copy-Item "artifacts/interop/NavBR.OmsiInterop.dll" `
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiInterop.dll" -Force

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore and publish openOMSI plugin x64
        shell: pwsh
        run: |
          dotnet restore src/NavBR.OpenOmsiPlugin/NavBR.OpenOmsiPlugin.csproj -r win-x64
          dotnet publish src/NavBR.OpenOmsiPlugin/NavBR.OpenOmsiPlugin.csproj `
            -c Release `
            -r win-x64 `
            --no-restore `
            -p:PublishAot=true `
            -p:NativeLib=Shared `
            -o artifacts/NavBR.OpenOmsiPlugin

      - name: Restore MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Prepare embedded plugin payloads
        shell: pwsh
        run: |
          .\scripts\prepare-embedded-plugin.ps1 `
            -PluginDirectory "artifacts/NavBR.OmsiPlugin.Experimental" `
            -OutputPath "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"
          .\scripts\prepare-embedded-openomsi-plugin.ps1 `
            -PluginDirectory "artifacts/NavBR.OpenOmsiPlugin" `
            -OutputPath "src/NavBR.Client/Assets/NavBR.OpenOmsiPlugin.bundle.zip"

      - name: Build desktop client x86
        shell: pwsh
        run: |
          dotnet build src/NavBR.Client/NavBR.Client.csproj `
            -c Release `
            -r win-x86 `
            --no-restore

      - name: Publish desktop client x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.Client/NavBR.Client.csproj `
            -c Release `
            -r win-x86 `
            --no-restore `
            --self-contained false `
            -o artifacts/NavBR.Client.Desktop

      - name: Upload desktop client
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-NavBR-Multiplayer-Desktop-React-win-x86
          path: artifacts/NavBR.Client.Desktop
          if-no-files-found: error
          retention-days: 14
