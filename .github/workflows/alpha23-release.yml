name: alpha23 public release

on:
  push:
    branches: [ publish/alpha23-public ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: alpha23-public-release
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.3.0-alpha.23
  RELEASE_TITLE: OMSI NavBR Multiplayer v0.3.0-alpha.23 - WinUI x64 + RuntimeHost x86

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version and validated build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $group = @($props.Project.PropertyGroup) | Where-Object { $_.VersionPrefix } | Select-Object -First 1
          $version = "$([string]$group.VersionPrefix)-$([string]$group.VersionSuffix)"
          if ($version -ne "0.3.0-alpha.23") { throw "Unexpected release version: $version" }

          $runs = gh run list --repo "${{ github.repository }}" --workflow build.yml --commit "$env:GITHUB_SHA" --status success --limit 20 --json databaseId,headSha,conclusion | ConvertFrom-Json
          $match = @($runs) | Where-Object { $_.headSha -eq $env:GITHUB_SHA -and $_.conclusion -eq "success" } | Select-Object -First 1
          if (-not $match) { throw "No successful build.yml run exists for $env:GITHUB_SHA." }
          "VALIDATED_BUILD_RUN=$($match.databaseId)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download validated artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path validated-artifacts -Force | Out-Null
          gh run download $env:VALIDATED_BUILD_RUN --repo "${{ github.repository }}" --dir validated-artifacts
          if ($LASTEXITCODE -ne 0) { throw "Artifact download failed." }

          foreach ($required in @(
            "validated-artifacts/OMSI-NavBR-Multiplayer-WinUI-win-x64",
            "validated-artifacts/OMSI-NavBR-Multiplayer-Setup-win-x64",
            "validated-artifacts/OMSI-NavBR-Plugin-experimental-win-x86",
            "validated-artifacts/OMSI-NavBR-Multiplayer-Simulator-win-x86",
            "validated-artifacts/OMSI-NavBR-Mobile-Android-Alpha2"
          )) {
            if (-not (Test-Path $required)) { throw "Missing validated artifact: $required" }
          }

          foreach ($required in @(
            "validated-artifacts/OMSI-NavBR-Multiplayer-WinUI-win-x64/OMSI.NavBR.Multiplayer.WinUI.exe",
            "validated-artifacts/OMSI-NavBR-Multiplayer-WinUI-win-x64/RuntimeHost/OMSI.NavBR.Multiplayer.exe"
          )) {
            if (-not (Test-Path $required)) { throw "Incomplete WinUI package: $required" }
          }

      - name: Package Alpha.23
        shell: pwsh
        run: |
          $out = "release-assets"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $installer = Get-ChildItem "validated-artifacts/OMSI-NavBR-Multiplayer-Setup-win-x64" -File -Filter "*-Setup-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Validated installer missing." }
          Copy-Item $installer.FullName "$out/OMSI-NavBR-Multiplayer-$env:RELEASE_TAG-Setup-win-x64.exe" -Force

          Compress-Archive -Path "validated-artifacts/OMSI-NavBR-Multiplayer-WinUI-win-x64/*" -DestinationPath "$out/OMSI-NavBR-Multiplayer-$env:RELEASE_TAG-WinUI-win-x64.zip" -Force
          Compress-Archive -Path "validated-artifacts/OMSI-NavBR-Plugin-experimental-win-x86/*" -DestinationPath "$out/OMSI-NavBR-Plugin-$env:RELEASE_TAG-win-x86.zip" -Force
          Compress-Archive -Path "validated-artifacts/OMSI-NavBR-Multiplayer-Simulator-win-x86/*" -DestinationPath "$out/OMSI-NavBR-Multiplayer-Simulator-$env:RELEASE_TAG-win-x86.zip" -Force

          $apk = Get-ChildItem "validated-artifacts/OMSI-NavBR-Mobile-Android-Alpha2" -File -Filter "*.apk" | Select-Object -First 1
          if (-not $apk) { throw "Validated APK missing." }
          Copy-Item $apk.FullName "$out/OMSI-NavBR-Mobile-Alpha2-$env:RELEASE_TAG-debug.apk" -Force

          if (Test-Path "validated-artifacts/OMSI-NavBR-integration-test-win-x86") {
            Compress-Archive -Path "validated-artifacts/OMSI-NavBR-integration-test-win-x86/*" -DestinationPath "$out/OMSI-NavBR-IntegrationTest-$env:RELEASE_TAG.zip" -Force
          }

          Copy-Item "docs/ALPHA23_RELEASE_NOTES.md" "$out/ALPHA23_RELEASE_NOTES.md" -Force
          $hashLines = foreach ($file in Get-ChildItem $out -File | Sort-Object Name) {
            if ($file.Name -eq "SHA256SUMS.txt") { continue }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $hashLines | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists." }
          $global:LASTEXITCODE = 0

          gh release create $env:RELEASE_TAG --repo "${{ github.repository }}" --target "$env:GITHUB_SHA" --title "$env:RELEASE_TITLE" --notes-file "docs/ALPHA23_RELEASE_NOTES.md" --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Could not create Alpha.23." }

          foreach ($asset in Get-ChildItem release-assets -File | Sort-Object Length,Name) {
            gh release upload $env:RELEASE_TAG $asset.FullName --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Upload failed: $($asset.Name)" }
          }

      - name: Verify prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" --json isDraft,isPrerelease,assets,url | ConvertFrom-Json
          if ($release.isDraft) { throw "Alpha.23 remained draft." }
          if (-not $release.isPrerelease) { throw "Alpha.23 is not marked prerelease." }

          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($required in @(
            "OMSI-NavBR-Multiplayer-$env:RELEASE_TAG-Setup-win-x64.exe",
            "OMSI-NavBR-Multiplayer-$env:RELEASE_TAG-WinUI-win-x64.zip",
            "OMSI-NavBR-Plugin-$env:RELEASE_TAG-win-x86.zip",
            "OMSI-NavBR-Multiplayer-Simulator-$env:RELEASE_TAG-win-x86.zip",
            "OMSI-NavBR-Mobile-Alpha2-$env:RELEASE_TAG-debug.apk",
            "SHA256SUMS.txt"
          )) {
            if ($required -notin $names) { throw "Missing published asset: $required" }
          }
          Write-Host "Alpha.23 published: $($release.url)"
