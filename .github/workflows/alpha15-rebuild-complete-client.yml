name: alpha15 rebuild complete client

on:
  push:
    branches:
      - publish/alpha15-complete-client

permissions:
  contents: write

concurrency:
  group: alpha15-complete-client-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v0.3.0-alpha.15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $group = @($props.Project.PropertyGroup) | Where-Object { $_.VersionPrefix } | Select-Object -First 1
          $tag = "v$([string]$group.VersionPrefix)-$([string]$group.VersionSuffix)"
          if ($tag -ne $env:RELEASE_TAG) { throw "Unexpected version: $tag" }

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React desktop UI
        shell: pwsh
        run: |
          Push-Location ui/navbr-web
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "NavBR React dependency install failed." }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "NavBR React build failed." }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path "ui/navbr-web/dist/index.html")) {
            throw "React WebView2 UI was not generated."
          }

          $distFiles = @(Get-ChildItem "ui/navbr-web/dist" -Recurse -File)
          if ($distFiles.Count -lt 2) {
            throw "React WebView2 UI output is incomplete."
          }

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Repair NavBR icon
        shell: pwsh
        run: .\scripts\repair-navbr-icon.ps1

      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.Server/NavBR.Server.csproj
          dotnet restore src/NavBR.Client/NavBR.Client.csproj -r win-x86
          dotnet restore src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj -r win-x86
          dotnet restore src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj -r win-x86

      - name: Build OMSI native interop x86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/interop" | Out-Null
          cl /nologo /LD /O2 /EHsc /DWIN32_LEAN_AND_MEAN `
            native/NavBR.OmsiInterop/NavBROmsiInterop.cpp `
            native/NavBR.OmsiInterop/NavBROmsiInteropState.cpp `
            /link /DEF:native/NavBR.OmsiInterop/NavBROmsiInterop.def `
            /OUT:artifacts/interop/NavBR.OmsiInterop.dll
          if ($LASTEXITCODE -ne 0) { throw "Native interop build failed." }

          $exports = (& dumpbin /nologo /exports "artifacts/interop/NavBR.OmsiInterop.dll") -join "`n"
          foreach ($required in @(
            "NavBR_GetStateInteropVersion",
            "NavBR_ResolveMapTileIndex",
            "NavBR_MakeVehicle",
            "NavBR_SetVehicleTransform",
            "NavBR_SetVehicleVisualState",
            "NavBR_SetHumanTransform",
            "NavBR_RestoreHumanDriverState"
          )) {
            if ($exports -notmatch "(?m)\b$([regex]::Escape($required))\b") {
              throw "Missing Alpha.15 interop export: $required"
            }
          }

      - name: Publish Native AOT OMSI plugin x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj `
            -c Release -r win-x86 --no-restore `
            -p:PublishAot=true -p:NativeLib=Shared `
            -o artifacts/plugin

          Copy-Item "artifacts/interop/NavBR.OmsiInterop.dll" "artifacts/plugin/NavBR.OmsiInterop.dll" -Force

          foreach ($required in @(
            "artifacts/plugin/NavBR.OmsiPlugin.dll",
            "artifacts/plugin/NavBR.OmsiInterop.dll",
            "artifacts/plugin/NavBR.OmsiPlugin.opl"
          )) {
            if (-not (Test-Path $required)) { throw "Plugin package incomplete: $required" }
          }

      - name: Prepare embedded OMSI plugin bundle
        shell: pwsh
        run: |
          .\scripts\prepare-embedded-plugin.ps1 `
            -PluginDirectory "artifacts/plugin" `
            -OutputPath "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"

          if (-not (Test-Path "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip")) {
            throw "Embedded plugin bundle was not generated."
          }

      - name: Build and validate client with React and embedded plugin
        shell: pwsh
        run: |
          dotnet build src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --no-restore

          $assembly = Get-ChildItem "src/NavBR.Client/bin" -Recurse -Filter "OMSI.NavBR.Multiplayer.dll" |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $assembly) { throw "Client assembly not found." }

          $bytes = [System.IO.File]::ReadAllBytes($assembly.FullName)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          if (-not $text.Contains("NavBR.Client.Assets.NavBROmsiPlugin.bundle.zip")) {
            throw "Client does not contain the embedded OMSI plugin bundle."
          }

      - name: Smoke-test Plugin Bridge
        shell: pwsh
        run: |
          dotnet publish src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -o artifacts/bridge-smoke
          & "artifacts/bridge-smoke/NavBR.PluginBridgeSmokeTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Plugin Bridge smoke test failed." }

      - name: Publish complete Windows x86 client
        shell: pwsh
        run: |
          dotnet publish src/NavBR.Client/NavBR.Client.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -o artifacts/client

          dotnet publish src/NavBR.Client/NavBR.Client.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o artifacts/client-single

          foreach ($required in @(
            "artifacts/client/WebUI/dist/index.html",
            "artifacts/client/OMSI.NavBR.Multiplayer.exe",
            "artifacts/client-single/OMSI.NavBR.Multiplayer.exe"
          )) {
            if (-not (Test-Path $required)) {
              throw "Complete client output missing: $required"
            }
          }

      - name: Package corrected Alpha.15 client
        shell: pwsh
        run: |
          Copy-Item LICENSE "artifacts/client/LICENSE" -Force
          Copy-Item THIRD_PARTY_NOTICES.md "artifacts/client/THIRD_PARTY_NOTICES.md" -Force
          New-Item -ItemType Directory -Force "artifacts/client/licenses" | Out-Null
          Copy-Item licenses/*.txt "artifacts/client/licenses/" -Force

          New-Item -ItemType Directory -Force "artifacts/release" | Out-Null
          Copy-Item "artifacts/client-single/OMSI.NavBR.Multiplayer.exe" `
            "artifacts/release/OMSI-NavBR-Multiplayer-$env:RELEASE_TAG-win-x86.exe" -Force

          Compress-Archive -Path "artifacts/client/*" `
            -DestinationPath "artifacts/release/OMSI-NavBR-Multiplayer-$env:RELEASE_TAG-win-x86.zip" -Force

          Compress-Archive -Path "artifacts/plugin/*" `
            -DestinationPath "artifacts/release/OMSI-NavBR-Plugin-$env:RELEASE_TAG-win-x86.zip" -Force

      - name: Replace incomplete Alpha.15 client assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($name in @(
            "OMSI-NavBR-Multiplayer-$env:RELEASE_TAG-win-x86.exe",
            "OMSI-NavBR-Multiplayer-$env:RELEASE_TAG-win-x86.zip",
            "OMSI-NavBR-Plugin-$env:RELEASE_TAG-win-x86.zip"
          )) {
            $path = Join-Path "artifacts/release" $name
            gh release upload $env:RELEASE_TAG $path --repo "${{ github.repository }}" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not replace $name." }
          }

      - name: Rebuild release SHA256SUMS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "alpha15-assets"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          New-Item -ItemType Directory -Force $temp | Out-Null

          gh release download $env:RELEASE_TAG --repo "${{ github.repository }}" --dir $temp
          if ($LASTEXITCODE -ne 0) { throw "Could not download release assets for checksum rebuild." }

          Remove-Item (Join-Path $temp "SHA256SUMS.txt") -Force -ErrorAction SilentlyContinue

          $lines = foreach ($file in Get-ChildItem $temp -File | Sort-Object Name) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $sumPath = Join-Path $temp "SHA256SUMS.txt"
          $lines | Set-Content $sumPath -Encoding ascii

          gh release upload $env:RELEASE_TAG $sumPath --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not replace SHA256SUMS.txt." }

      - name: Verify corrected release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" --json assets --jq ".assets[].name"
          foreach ($required in @(
            "OMSI-NavBR-Multiplayer-$env:RELEASE_TAG-win-x86.exe",
            "OMSI-NavBR-Multiplayer-$env:RELEASE_TAG-win-x86.zip",
            "OMSI-NavBR-Plugin-$env:RELEASE_TAG-win-x86.zip",
            "OMSI-NavBR-Multiplayer-Simulator-$env:RELEASE_TAG-win-x64-dev.zip",
            "OMSI-NavBR-Server-$env:RELEASE_TAG-win-x64.zip",
            "SHA256SUMS.txt"
          )) {
            if ($assets -notcontains $required) {
              throw "Corrected Alpha.15 is still missing: $required"
            }
          }
