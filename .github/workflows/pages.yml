name: pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'src/NavBR.Client/Assets/NavBR.ico'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site assets
        shell: bash
        run: |
          mkdir -p site/assets
          cp src/NavBR.Client/Assets/NavBR.ico site/assets/navbr.ico

      - name: Build release catalog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=6" \
            | jq '[.[] | {
                tag_name,
                name,
                prerelease,
                published_at,
                html_url,
                body,
                assets: [.assets[] | {name, browser_download_url, size}]
              }]' \
            > site/releases.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
