name: pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'src/NavBR.Client/Assets/NavBR.ico'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare site assets
        shell: bash
        run: |
          mkdir -p site/assets
          cp src/NavBR.Client/Assets/NavBR.ico site/assets/navbr.ico

      - name: Build release catalog and download statistics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            | jq '
                (sort_by(.published_at // .created_at) | reverse) as $all
                | ($all | map(select((.tag_name | test("-test(\\.|-|$)"; "i")) | not))) as $official
                | {
                    total_downloads: ([$official[] | .assets[] | select(.name | test("\\.(exe|zip)$"; "i")) | .download_count] | add // 0),
                    releases: ($all[:8] | map({
                      tag_name,
                      name,
                      prerelease,
                      published_at,
                      html_url,
                      body,
                      download_count: ([.assets[] | select(.name | test("\\.(exe|zip)$"; "i")) | .download_count] | add // 0),
                      assets: [.assets[] | {name, browser_download_url, size, download_count}]
                    }))
                  }
              ' \
            > site/releases.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
