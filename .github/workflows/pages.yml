name: pages

on:
  push:
    branches: [ main, deploy/alpha14-react-site ]
    paths:
      - 'site/**'
      - 'src/NavBR.Client/Assets/NavBR.ico'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare site assets
        shell: bash
        run: |
          mkdir -p site/assets
          cp src/NavBR.Client/Assets/NavBR.ico site/assets/navbr.ico

      - name: Build release catalog and download statistics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # GitHub's general releases endpoint can occasionally lag behind
          # releases that are already available by tag. Start with the normal
          # list and recover any release-backed tag that is missing from it.
          gh api "repos/${{ github.repository }}/releases?per_page=100" > /tmp/navbr-releases.json

          gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name' \
            > /tmp/navbr-tags.txt

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue

            if jq -e --arg tag "$tag" '.[] | select(.tag_name == $tag)' \
              /tmp/navbr-releases.json > /dev/null; then
              continue
            fi

            if gh api "repos/${{ github.repository }}/releases/tags/$tag" \
              > /tmp/navbr-release-recovered.json 2>/dev/null; then
              jq --slurpfile recovered /tmp/navbr-release-recovered.json \
                '. + $recovered | unique_by(.id)' \
                /tmp/navbr-releases.json > /tmp/navbr-releases-next.json
              mv /tmp/navbr-releases-next.json /tmp/navbr-releases.json
            fi
          done < /tmp/navbr-tags.txt

          jq '
              (sort_by(.published_at // .created_at) | reverse) as $all
              | {
                  total_downloads: ([$all[] | .assets[] | select(.name | test("\\.(exe|zip)$"; "i")) | .download_count] | add // 0),
                  alpha_downloads: (
                    [
                      $all[] as $release
                      | ($release.tag_name | capture("alpha\\.(?<number>[0-9]+)"; "i")? // null) as $alpha
                      | select($alpha != null)
                      | {
                          key: ("alpha." + $alpha.number),
                          value: ([$release.assets[] | select(.name | test("\\.(exe|zip)$"; "i")) | .download_count] | add // 0)
                        }
                    ]
                    | group_by(.key)
                    | map({key: .[0].key, value: (map(.value) | add // 0)})
                    | from_entries
                  ),
                  releases: ($all[:12] | map({
                    tag_name,
                    name,
                    prerelease,
                    published_at,
                    html_url,
                    body,
                    download_count: ([.assets[] | select(.name | test("\\.(exe|zip)$"; "i")) | .download_count] | add // 0),
                    assets: [.assets[] | {name, browser_download_url, size, download_count}]
                  }))
                }
            ' \
            /tmp/navbr-releases.json \
          > site/releases.json

      - name: Build React public site
        shell: bash
        run: |
          set -euo pipefail
          pushd site
          npm install --no-audit --no-fund
          npm run build
          popd

          cp -R site/assets site/dist/assets
          cp site/releases.json site/dist/releases.json
          cp site/monetization.json site/dist/monetization.json
          cp site/diagnostics.json site/dist/diagnostics.json
          cp site/.nojekyll site/dist/.nojekyll
          if [ -f site/ads.txt ]; then cp site/ads.txt site/dist/ads.txt; fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
