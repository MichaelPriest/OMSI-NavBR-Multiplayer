name: alpha11-build

on:
  push:
    branches:
      - feature/alpha11-deep-omsi-integration
      - feature/alpha11-ui-refresh-hardware
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/alpha11-build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Generate NavBR icon
        shell: pwsh
        run: .\scripts\repair-navbr-icon.ps1

      - name: Validate XAML colors
        shell: pwsh
        run: .\scripts\validate-xaml-colors.ps1

      - name: Validate site JavaScript
        shell: pwsh
        run: node --check site/app.js

      - name: Build OMSI native interop x86
        shell: pwsh
        run: |
          msbuild native\NavBR.OmsiInterop\NavBR.OmsiInterop.vcxproj `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /m

      - name: Verify native interop exports
        shell: pwsh
        run: |
          $dll = Resolve-Path "native\NavBR.OmsiInterop\Release\NavBR.OmsiInterop.dll"
          dumpbin /headers $dll | Select-String 'machine \(x86\)' | Out-Null
          if (-not $?) { throw "NavBR.OmsiInterop.dll is not x86" }
          $exports = dumpbin /exports $dll | Out-String
          foreach ($name in @('NavBR_CreateRoadVehicle','NavBR_RemoveRoadVehicle','NavBR_SetMovingObjectPose')) {
            if ($exports -notmatch [regex]::Escape($name)) { throw "Missing native export: $name" }
          }

      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.Server/NavBR.Server.csproj
          dotnet restore src/NavBR.Client/NavBR.Client.csproj -r win-x86
          dotnet restore src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj -r win-x86
          dotnet restore src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj -r win-x86

      - name: Build shared and server
        shell: pwsh
        run: |
          dotnet build src/NavBR.Shared/NavBR.Shared.csproj -c Release --no-restore
          dotnet build src/NavBR.Server/NavBR.Server.csproj -c Release --no-restore

      - name: Publish Native AOT OMSI plugin x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj `
            -c Release `
            -r win-x86 `
            --no-restore `
            -p:PublishAot=true `
            -p:NativeLib=Shared `
            -o artifacts/NavBR.OmsiPlugin.Experimental

      - name: Validate plugin binary
        shell: pwsh
        run: |
          $dll = Resolve-Path "artifacts\NavBR.OmsiPlugin.Experimental\NavBR.OmsiPlugin.dll"
          dumpbin /headers $dll | Select-String 'machine \(x86\)' | Out-Null
          if (-not $?) { throw "NavBR.OmsiPlugin.dll is not x86" }

      - name: Prepare embedded plugin bundle
        shell: pwsh
        run: |
          .\scripts\prepare-embedded-plugin.ps1 `
            -PublishDir artifacts/NavBR.OmsiPlugin.Experimental `
            -Destination src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip

      - name: Build client
        shell: pwsh
        run: dotnet build src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --no-restore

      - name: Plugin bridge v2 smoke test
        shell: pwsh
        run: dotnet run --project src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj -c Release -r win-x86 --no-restore

      - name: Publish client smoke artifact
        shell: pwsh
        run: |
          dotnet publish src/NavBR.Client/NavBR.Client.csproj `
            -c Release `
            -r win-x86 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -o artifacts/NavBR.Client

      - name: Upload alpha11 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha11-client-win-x86
          path: artifacts/NavBR.Client
