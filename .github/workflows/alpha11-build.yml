name: alpha11-build

on:
  push:
    branches: [ feature/alpha11-deep-omsi-integration ]
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/alpha11-build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Generate NavBR icon
        shell: pwsh
        run: .\scripts\repair-navbr-icon.ps1

      - name: Validate XAML colors
        shell: pwsh
        run: .\scripts\validate-xaml-colors.ps1

      - name: Validate site JavaScript
        shell: pwsh
        run: node --check site/app.js

      - name: Build OMSI native interop x86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/NavBR.OmsiInterop" | Out-Null
          cl /nologo /LD /O2 /EHsc /DWIN32_LEAN_AND_MEAN `
            native/NavBR.OmsiInterop/NavBROmsiInterop.cpp `
            /link `
            /DEF:native/NavBR.OmsiInterop/NavBROmsiInterop.def `
            /OUT:artifacts/NavBR.OmsiInterop/NavBR.OmsiInterop.dll
          if ($LASTEXITCODE -ne 0) { throw "Native OMSI interop build failed." }

          $exports = (& dumpbin /nologo /exports "artifacts/NavBR.OmsiInterop/NavBR.OmsiInterop.dll") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect native OMSI interop exports." }
          foreach ($expected in @(
            "NavBR_GetAbiVersion",
            "NavBR_GetImageBase",
            "NavBR_ProbeOmsi23004Addresses",
            "NavBR_GetMem",
            "NavBR_FreeMem",
            "NavBR_LockMakeVehicle",
            "NavBR_UnlockMakeVehicle",
            "NavBR_AllocateAnsiString",
            "NavBR_FreeAnsiString",
            "NavBR_TempRoadVehicleListCreate",
            "NavBR_CopyTempRoadVehicleListIntoMain",
            "NavBR_MakeVehicle"
          )) {
            if ($exports -notmatch "(?m)\b$([regex]::Escape($expected))\b") {
              throw "Missing native OMSI interop export: $expected"
            }
          }

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.Server/NavBR.Server.csproj
          dotnet restore src/NavBR.Client/NavBR.Client.csproj -r win-x86
          dotnet restore src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj -r win-x86
          dotnet restore src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj -r win-x86

      - name: Build shared and server
        shell: pwsh
        run: |
          dotnet build src/NavBR.Shared/NavBR.Shared.csproj -c Release --no-restore
          dotnet build src/NavBR.Server/NavBR.Server.csproj -c Release --no-restore

      - name: Publish Native AOT OMSI plugin x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj `
            -c Release -r win-x86 --no-restore `
            -p:PublishAot=true -p:NativeLib=Shared `
            -o artifacts/NavBR.OmsiPlugin.Experimental
          Copy-Item `
            "artifacts/NavBR.OmsiInterop/NavBR.OmsiInterop.dll" `
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiInterop.dll" `
            -Force

      - name: Validate Native AOT plugin x86
        shell: pwsh
        run: |
          foreach ($candidate in @(
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiPlugin.dll",
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiInterop.dll"
          )) {
            $dll = Resolve-Path $candidate
            $bytes = [System.IO.File]::ReadAllBytes($dll.Path)
            if ([BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) { throw "$candidate is not PE/MZ." }
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550) { throw "Invalid PE signature: $candidate" }
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne 0x014C) { throw ("$candidate must be x86; machine=0x{0:X4}" -f $machine) }
          }

      - name: Prepare embedded plugin
        shell: pwsh
        run: >-
          .\scripts\prepare-embedded-plugin.ps1
          -PluginDirectory "artifacts/NavBR.OmsiPlugin.Experimental"
          -OutputPath "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"

      - name: Build client
        shell: pwsh
        run: dotnet build src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --no-restore

      - name: Smoke-test bridge v2
        shell: pwsh
        run: |
          dotnet publish src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -o artifacts/NavBR.PluginBridgeSmokeTest
          & "artifacts/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Plugin bridge smoke test failed." }

      - name: Publish standalone client
        shell: pwsh
        run: >-
          dotnet publish src/NavBR.Client/NavBR.Client.csproj
          -c Release -r win-x86 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/NavBR.Client.Single

      - name: Upload alpha.11 standalone candidate
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-NavBR-alpha11-standalone-win-x86
          path: artifacts/NavBR.Client.Single/OMSI.NavBR.Multiplayer.exe
          if-no-files-found: error
          retention-days: 14
