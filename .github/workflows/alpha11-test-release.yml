name: alpha11-test-release

on:
  push:
    branches: [ test/alpha11-test1 ]
    paths:
      - 'Directory.Build.props'
      - '.github/workflows/alpha11-test-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve test version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $group = @($props.Project.PropertyGroup) | Where-Object { $_.VersionPrefix } | Select-Object -First 1
          $prefix = [string]$group.VersionPrefix
          $suffix = [string]$group.VersionSuffix
          if ([string]::IsNullOrWhiteSpace($prefix) -or [string]::IsNullOrWhiteSpace($suffix)) {
            throw "Test release requires VersionPrefix and VersionSuffix."
          }
          $tag = "v$prefix-$suffix"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo "${{ github.repository }}" --json tagName 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Generate NavBR icon
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: .\scripts\repair-navbr-icon.ps1

      - name: Validate XAML colors
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: .\scripts\validate-xaml-colors.ps1

      - name: Restore
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.Server/NavBR.Server.csproj
          dotnet restore src/NavBR.Client/NavBR.Client.csproj -r win-x86
          dotnet restore src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj -r win-x86
          dotnet restore src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj -r win-x86

      - name: Publish Native AOT OMSI plugin x86
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet publish src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj `
            -c Release -r win-x86 --no-restore `
            -p:PublishAot=true -p:NativeLib=Shared `
            -o artifacts/plugin

      - name: Prepare embedded plugin
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: >-
          .\scripts\prepare-embedded-plugin.ps1
          -PluginDirectory "artifacts/plugin"
          -OutputPath "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"

      - name: Build and smoke-test bridge
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet build src/NavBR.Shared/NavBR.Shared.csproj -c Release --no-restore
          dotnet build src/NavBR.Server/NavBR.Server.csproj -c Release --no-restore
          dotnet build src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --no-restore
          dotnet publish src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -o artifacts/smoke
          & "artifacts/smoke/NavBR.PluginBridgeSmokeTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Plugin bridge smoke test failed." }

      - name: Publish Windows x86 client
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: dotnet publish src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --self-contained true --no-restore -o artifacts/client

      - name: Publish standalone Windows x86 EXE
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: >-
          dotnet publish src/NavBR.Client/NavBR.Client.csproj
          -c Release -r win-x86 --self-contained true --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/client-single

      - name: Publish Windows x64 server
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: dotnet publish src/NavBR.Server/NavBR.Server.csproj -c Release -r win-x64 --self-contained true -o artifacts/server

      - name: Add notices and package assets
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          foreach ($target in @("artifacts/client", "artifacts/server", "artifacts/plugin")) {
            Copy-Item LICENSE "$target/LICENSE" -Force
            Copy-Item THIRD_PARTY_NOTICES.md "$target/THIRD_PARTY_NOTICES.md" -Force
          }
          $exe = "artifacts/client-single/OMSI.NavBR.Multiplayer.exe"
          if (-not (Test-Path $exe)) { throw "Standalone EXE not generated." }
          Copy-Item $exe "OMSI-NavBR-Multiplayer-$tag-win-x86.exe"
          Compress-Archive -Path artifacts/client/* -DestinationPath "OMSI-NavBR-Multiplayer-$tag-win-x86.zip"
          Compress-Archive -Path artifacts/server/* -DestinationPath "OMSI-NavBR-Server-$tag-win-x64.zip"
          Compress-Archive -Path artifacts/plugin/* -DestinationPath "OMSI-NavBR-Plugin-Experimental-$tag-win-x86.zip"

          @"
          # OMSI NavBR Multiplayer $tag — Test 1

          Primeira build pública de teste da série alpha.11.

          ## Prioridades para validar
          - HUD/minimapa durante gameplay e ocultação em menus/diálogos.
          - pontos de parada e ícone padrão OMSI no GPS.
          - visão geral da rota completa.
          - multiplayer, chat, voz e marcadores remotos.
          - identificação do ônibus remoto e telemetria 3D exata.
          - captura e transmissão experimental do tráfego AI com autoridade do host.

          ## Importante
          A criação física do ônibus remoto e do tráfego 3D dentro do OMSI continua protegida pelo backend experimental e ainda não deve ser considerada funcional nesta Test 1. Esta build serve para validar toda a infraestrutura que antecede a injeção física, além das funções de HUD/mapa já implementadas.

          Use uma cópia/instalação de teste do plugin experimental. A alpha.10 oficial permanece separada.
          "@ | Set-Content RELEASE_NOTES_TEST1.md -Encoding utf8

      - name: Create GitHub prerelease
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release create $tag `
            "OMSI-NavBR-Multiplayer-$tag-win-x86.exe" `
            "OMSI-NavBR-Multiplayer-$tag-win-x86.zip" `
            "OMSI-NavBR-Server-$tag-win-x64.zip" `
            "OMSI-NavBR-Plugin-Experimental-$tag-win-x86.zip" `
            "LICENSE" `
            "THIRD_PARTY_NOTICES.md" `
            --repo "${{ github.repository }}" `
            --target "$env:GITHUB_SHA" `
            --title "OMSI NavBR Multiplayer $tag — Test 1" `
            --notes-file RELEASE_NOTES_TEST1.md `
            --prerelease
