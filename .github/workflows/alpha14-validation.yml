name: alpha14 validation

on:
  push:
    branches:
      - feature/alpha14-roleplay

permissions:
  contents: read

concurrency:
  group: alpha14-validation
  cancel-in-progress: true

jobs:
  validate-alpha14:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Generate NavBR icon
        shell: pwsh
        run: .\scripts\repair-navbr-icon.ps1

      - name: Validate XAML and portal JavaScript
        shell: pwsh
        run: |
          .\scripts\validate-xaml-colors.ps1
          node --check site/app.js
          node --check site/modern.js

      - name: Restore Alpha.14 projects
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.Server/NavBR.Server.csproj
          dotnet restore src/NavBR.Client/NavBR.Client.csproj -r win-x86
          dotnet restore src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj -r win-x86
          dotnet restore src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj -r win-x86

      - name: Build shared and server
        shell: pwsh
        run: |
          dotnet build src/NavBR.Shared/NavBR.Shared.csproj -c Release --no-restore
          dotnet build src/NavBR.Server/NavBR.Server.csproj -c Release --no-restore

      - name: Build OMSI native interop x86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/interop" | Out-Null
          cl /nologo /LD /O2 /EHsc /DWIN32_LEAN_AND_MEAN `
            native/NavBR.OmsiInterop/NavBROmsiInterop.cpp `
            native/NavBR.OmsiInterop/NavBROmsiInteropState.cpp `
            /link `
            /DEF:native/NavBR.OmsiInterop/NavBROmsiInterop.def `
            /OUT:artifacts/interop/NavBR.OmsiInterop.dll
          if ($LASTEXITCODE -ne 0) { throw "Native OMSI interop build failed." }

          $exports = (& dumpbin /nologo /exports "artifacts/interop/NavBR.OmsiInterop.dll") -join "`n"
          foreach ($name in @(
            'NavBR_GetAbiVersion',
            'NavBR_GetStateInteropVersion',
            'NavBR_GetHumanCount',
            'NavBR_GetHumanAt',
            'NavBR_IsHumanPointer',
            'NavBR_IsPlayerBusDriverHuman',
            'NavBR_ReadHumanPose',
            'NavBR_ReadHumanDriverState',
            'NavBR_DetachHumanForRoleplay',
            'NavBR_SetHumanTransform',
            'NavBR_RestoreHumanAiState',
            'NavBR_RestoreHumanDriverState'
          )) {
            if ($exports -notmatch "(?m)\b$([regex]::Escape($name))\b") {
              throw "Native OMSI interop is missing RP export: $name"
            }
          }

      - name: Publish Native AOT OMSI plugin x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj `
            -c Release `
            -r win-x86 `
            --no-restore `
            -p:PublishAot=true `
            -p:NativeLib=Shared `
            -o artifacts/NavBR.OmsiPlugin.Experimental

      - name: Rebuild embedded OMSI plugin v3 bundle
        shell: pwsh
        run: |
          Copy-Item "artifacts/interop/NavBR.OmsiInterop.dll" `
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiInterop.dll" -Force

          .\scripts\prepare-embedded-plugin.ps1 `
            -PluginDirectory "artifacts/NavBR.OmsiPlugin.Experimental" `
            -OutputPath "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"

          foreach ($required in @(
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiPlugin.dll",
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiInterop.dll",
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiPlugin.opl",
            "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"
          )) {
            if (-not (Test-Path $required)) {
              throw "Updated Alpha.14 plugin payload is incomplete: $required"
            }
          }
      - name: Validate plugin protocol generation
        shell: pwsh
        run: |
          $protocol = Get-Content "src/NavBR.Shared/PluginBridge/PluginBridgeProtocol.cs" -Raw
          if ($protocol -notmatch 'Version\s*=\s*3\s*;') { throw "Alpha.14 requires plugin bridge protocol v3." }
          if ($protocol -notmatch 'Plugin\.v3') { throw "Alpha.14 requires the v3 named pipe." }

          $managedInterop = Get-Content "src/NavBR.OmsiPluginExperimental/OmsiNativeInterop.cs" -Raw
          if ($managedInterop -notmatch 'ExpectedStateInteropVersion\s*=\s*3\s*;') {
            throw "Managed OMSI interop must require state ABI v3."
          }

          $nativeInterop = Get-Content "native/NavBR.OmsiInterop/NavBROmsiInteropState.cpp" -Raw
          if ($nativeInterop -notmatch 'NavBR_GetStateInteropVersion\(\)[\s\S]*?return\s+3\s*;') {
            throw "Native OMSI interop must expose state ABI v3."
          }

      - name: Build Windows x86 client
        shell: pwsh
        run: dotnet build src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --no-restore

      - name: Smoke-test plugin bridge v3
        shell: pwsh
        run: |
          dotnet publish src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -o artifacts/bridge-smoke
          & "artifacts/bridge-smoke/NavBR.PluginBridgeSmokeTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Plugin bridge v3 smoke test failed." }
