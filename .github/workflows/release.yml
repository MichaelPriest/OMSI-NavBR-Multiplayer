name: release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version and release state
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $group = @($props.Project.PropertyGroup) | Where-Object { $_.VersionPrefix } | Select-Object -First 1
          $prefix = [string]$group.VersionPrefix
          $suffix = [string]$group.VersionSuffix

          if ([string]::IsNullOrWhiteSpace($prefix)) {
            throw "VersionPrefix not found in Directory.Build.props"
          }

          $tag = if ([string]::IsNullOrWhiteSpace($suffix)) { "v$prefix" } else { "v$prefix-$suffix" }
          $prerelease = -not [string]::IsNullOrWhiteSpace($suffix)

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          gh release view $tag --repo "${{ github.repository }}" --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0

          if ($releaseExists) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag already exists. Nothing to publish."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag will be created from commit $env:GITHUB_SHA."
          }

          exit 0

      - name: Publish Windows x86 client
        if: steps.version.outputs.exists != 'true'
        run: dotnet publish src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --self-contained true -o artifacts/client

      - name: Publish Windows x64 server
        if: steps.version.outputs.exists != 'true'
        run: dotnet publish src/NavBR.Server/NavBR.Server.csproj -c Release -r win-x64 --self-contained true -o artifacts/server

      - name: Package release assets
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          Compress-Archive -Path artifacts/client/* -DestinationPath "OMSI-NavBR-Multiplayer-$tag-win-x86.zip"
          Compress-Archive -Path artifacts/server/* -DestinationPath "OMSI-NavBR-Server-$tag-win-x64.zip"

      - name: Create GitHub release
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $args = @(
            "release", "create", $tag,
            "OMSI-NavBR-Multiplayer-$tag-win-x86.zip",
            "OMSI-NavBR-Server-$tag-win-x64.zip",
            "--repo", "${{ github.repository }}",
            "--target", "$env:GITHUB_SHA",
            "--title", "OMSI NavBR Multiplayer $tag",
            "--generate-notes"
          )

          if ("${{ steps.version.outputs.prerelease }}" -eq "true") {
            $args += "--prerelease"
          }

          & gh @args
