name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x86 client
        run: dotnet publish src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --self-contained true -o artifacts/client

      - name: Publish Windows x64 server
        run: dotnet publish src/NavBR.Server/NavBR.Server.csproj -c Release -r win-x64 --self-contained true -o artifacts/server

      - name: Package release assets
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/client/* -DestinationPath "OMSI-NavBR-Multiplayer-${{ github.ref_name }}-win-x86.zip"
          Compress-Archive -Path artifacts/server/* -DestinationPath "OMSI-NavBR-Server-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "OMSI-NavBR-Multiplayer-${{ github.ref_name }}-win-x86.zip" `
            "OMSI-NavBR-Server-${{ github.ref_name }}-win-x64.zip" `
            --title "OMSI NavBR Multiplayer ${{ github.ref_name }}" `
            --generate-notes `
            --prerelease
