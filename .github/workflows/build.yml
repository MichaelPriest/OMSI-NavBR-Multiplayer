name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore shared
        run: dotnet restore src/NavBR.Shared/NavBR.Shared.csproj

      - name: Restore server
        run: dotnet restore src/NavBR.Server/NavBR.Server.csproj

      - name: Restore client
        run: dotnet restore src/NavBR.Client/NavBR.Client.csproj

      - name: Build shared
        run: dotnet build src/NavBR.Shared/NavBR.Shared.csproj -c Release --no-restore

      - name: Build server
        run: dotnet build src/NavBR.Server/NavBR.Server.csproj -c Release --no-restore

      - name: Build client
        run: dotnet build src/NavBR.Client/NavBR.Client.csproj -c Release --no-restore

      - name: Publish Windows x86 client
        run: dotnet publish src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --self-contained true -o artifacts/NavBR.Client

      - name: Upload NavBR client test build
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-NavBR-Multiplayer-win-x86
          path: artifacts/NavBR.Client
          if-no-files-found: error
          retention-days: 14
