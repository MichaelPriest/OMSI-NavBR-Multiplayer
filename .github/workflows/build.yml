name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - 'site/**'
      - '**/*.md'

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build React desktop UI
        shell: pwsh
        run: |
          Push-Location ui/navbr-web
          try {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "NavBR React dependency install failed." }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "NavBR React build failed." }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path "ui/navbr-web/dist/index.html")) {
            throw "React WebView2 UI was not generated."
          }

          $distFiles = @(Get-ChildItem "ui/navbr-web/dist" -Recurse -File)
          if ($distFiles.Count -lt 2) {
            throw "React WebView2 UI output is incomplete."
          }

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Generate compact NavBR app icon
        shell: pwsh
        run: .\scripts\repair-navbr-icon.ps1

      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.Server/NavBR.Server.csproj
          dotnet restore src/NavBR.MultiplayerSimulator/NavBR.MultiplayerSimulator.csproj -r win-x86
          dotnet restore src/NavBR.Client/NavBR.Client.csproj -r win-x86
          dotnet restore src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj -r win-x86
          dotnet restore src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj -r win-x86

      - name: Build shared and server
        shell: pwsh
        run: |
          dotnet build src/NavBR.Shared/NavBR.Shared.csproj -c Release --no-restore
          dotnet build src/NavBR.Server/NavBR.Server.csproj -c Release --no-restore
          dotnet build src/NavBR.MultiplayerSimulator/NavBR.MultiplayerSimulator.csproj -c Release --no-restore

      - name: Build OMSI native interop x86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/interop" | Out-Null
          cl /nologo /LD /O2 /EHsc /DWIN32_LEAN_AND_MEAN `
            native/NavBR.OmsiInterop/NavBROmsiInterop.cpp `
            native/NavBR.OmsiInterop/NavBROmsiInteropState.cpp `
            /link `
            /DEF:native/NavBR.OmsiInterop/NavBROmsiInterop.def `
            /OUT:artifacts/interop/NavBR.OmsiInterop.dll
          if ($LASTEXITCODE -ne 0) { throw "Native OMSI interop build failed." }

          $exports = (& dumpbin /nologo /exports "artifacts/interop/NavBR.OmsiInterop.dll") -join "`n"
          foreach ($name in @(
            'NavBR_GetAbiVersion',
            'NavBR_GetStateInteropVersion',
            'NavBR_ProbeRoleplayHumanControl',
            'NavBR_ProbePhysicalVehicleBackend',
            'NavBR_GetRoadVehicleCount',
            'NavBR_GetRoadVehicleAt',
            'NavBR_IsRoadVehiclePointer',
            'NavBR_GetHumanCount',
            'NavBR_GetHumanAt',
            'NavBR_IsHumanPointer',
            'NavBR_IsPlayerBusDriverHuman',
            'NavBR_ReadHumanPose',
            'NavBR_ReadHumanDriverState',
            'NavBR_DetachHumanForRoleplay',
            'NavBR_SetHumanTransform',
            'NavBR_RestoreHumanAiState',
            'NavBR_RestoreHumanDriverState',
            'NavBR_MakeVehicle',
            'NavBR_SetVehicleTransform',
            'NavBR_SetVehicleVisualState',
            'NavBR_MarkVehicleForKilling'
          )) {
            if ($exports -notmatch "(?m)\b$([regex]::Escape($name))\b") {
              throw "Native OMSI interop is missing export: $name"
            }
          }

      - name: Publish Native AOT OMSI plugin x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj `
            -c Release `
            -r win-x86 `
            --no-restore `
            -p:PublishAot=true `
            -p:NativeLib=Shared `
            -o artifacts/NavBR.OmsiPlugin.Experimental

          Copy-Item "artifacts/interop/NavBR.OmsiInterop.dll" `
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiInterop.dll" -Force

          foreach ($required in @(
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiPlugin.dll",
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiInterop.dll",
            "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiPlugin.opl",
            "artifacts/NavBR.OmsiPlugin.Experimental/Install-NavBROmsiPlugin.ps1",
            "artifacts/NavBR.OmsiPlugin.Experimental/Remove-NavBROmsiPlugin.ps1"
          )) {
            if (-not (Test-Path $required)) {
              throw "Native AOT plugin package incomplete: $required"
            }
          }

      - name: Validate Native AOT x86 DLL and OMSI exports
        shell: pwsh
        run: |
          $dll = Resolve-Path "artifacts/NavBR.OmsiPlugin.Experimental/NavBR.OmsiPlugin.dll"

          $bytes = [System.IO.File]::ReadAllBytes($dll.Path)
          if ([BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) { throw "Plugin is not PE/MZ." }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550) { throw "Plugin has invalid PE signature." }
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x014C) { throw ("Plugin must be x86/I386; machine=0x{0:X4}" -f $machine) }

          $exports = (& dumpbin /nologo /exports $dll.Path) -join "`n"
          foreach ($name in @(
            'PluginStart',
            'PluginFinalize',
            'AccessVariable',
            'AccessTrigger',
            'AccessStringVariable',
            'AccessSystemVariable'
          )) {
            if ($exports -notmatch "(?m)\b$([regex]::Escape($name))\b") {
              throw "Native AOT plugin is missing OMSI export: $name"
            }
          }

          Write-Host "Native AOT plugin validated: x86 + all OMSI exports."

      - name: Smoke-test Native AOT plugin install and removal without .NET x86
        shell: pwsh
        run: |
          $fakeOmsi = Join-Path $env:RUNNER_TEMP "NavBR-Omsi-NativeAot-Smoke"
          if (Test-Path $fakeOmsi) { Remove-Item $fakeOmsi -Recurse -Force }
          New-Item -ItemType Directory -Path $fakeOmsi -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $fakeOmsi "Omsi.exe") -Force | Out-Null

          Remove-Item Env:DOTNET_ROOT_X86 -ErrorAction SilentlyContinue
          Remove-Item 'Env:DOTNET_ROOT(x86)' -ErrorAction SilentlyContinue

          $package = Resolve-Path "artifacts/NavBR.OmsiPlugin.Experimental"
          & (Join-Path $package "Install-NavBROmsiPlugin.ps1") -OmsiRoot $fakeOmsi

          $plugins = Join-Path $fakeOmsi "plugins"
          $manifest = Join-Path $plugins "NavBR.OmsiPlugin.install-manifest.txt"
          foreach ($installed in @(
            $manifest,
            (Join-Path $plugins "NavBR.OmsiPlugin.dll"),
            (Join-Path $plugins "NavBR.OmsiInterop.dll"),
            (Join-Path $plugins "NavBR.OmsiPlugin.opl")
          )) {
            if (-not (Test-Path $installed)) { throw "Native AOT installer did not create: $installed" }
          }

          $manifestText = Get-Content -LiteralPath $manifest -Raw
          if ($manifestText -notmatch 'Native AOT x86') {
            throw "Native AOT deployment was not recorded in manifest."
          }
          if ($manifestText -match 'Microsoft\.NETCore\.App') {
            throw "Manifest still declares an external .NET runtime dependency."
          }

          & (Join-Path $package "Remove-NavBROmsiPlugin.ps1") -OmsiRoot $fakeOmsi
          foreach ($removed in @(
            $manifest,
            (Join-Path $plugins "NavBR.OmsiPlugin.dll"),
            (Join-Path $plugins "NavBR.OmsiInterop.dll"),
            (Join-Path $plugins "NavBR.OmsiPlugin.opl")
          )) {
            if (Test-Path $removed) { throw "Plugin remover left file behind: $removed" }
          }
          Remove-Item $fakeOmsi -Recurse -Force
          Write-Host "Native AOT install/remove smoke test passed without .NET x86 runtime setup."

      - name: Prepare embedded OMSI plugin payload
        shell: pwsh
        run: >-
          .\scripts\prepare-embedded-plugin.ps1
          -PluginDirectory "artifacts/NavBR.OmsiPlugin.Experimental"
          -OutputPath "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"

      - name: Build client
        shell: pwsh
        run: dotnet build src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --no-restore

      - name: Validate embedded plugin resource without loading x86 assembly
        shell: pwsh
        run: |
          $assembly = Get-ChildItem "src/NavBR.Client/bin" -Recurse -Filter "OMSI.NavBR.Multiplayer.dll" | Select-Object -First 1
          if (-not $assembly) { throw "NavBR client assembly was not found after build." }
          $bytes = [System.IO.File]::ReadAllBytes($assembly.FullName)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          if (-not $text.Contains("NavBR.Client.Assets.NavBROmsiPlugin.bundle.zip")) {
            throw "Client metadata does not contain the embedded OMSI plugin payload."
          }
          Write-Host "Embedded Native AOT plugin resource validated."

      - name: Smoke-test plugin bridge handshake and status
        shell: pwsh
        run: |
          dotnet publish src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -o artifacts/NavBR.PluginBridgeSmokeTest
          & "artifacts/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Plugin bridge smoke test failed." }

      - name: Publish Windows x86 client
        shell: pwsh
        run: |
          dotnet publish src/NavBR.Client/NavBR.Client.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -o artifacts/NavBR.Client

          foreach ($required in @(
            "artifacts/NavBR.Client/OMSI.NavBR.Multiplayer.exe",
            "artifacts/NavBR.Client/WebUI/dist/index.html"
          )) {
            if (-not (Test-Path $required)) {
              throw "Complete client output missing: $required"
            }
          }

      - name: Publish standalone Windows x86 EXE
        shell: pwsh
        run: >-
          dotnet publish src/NavBR.Client/NavBR.Client.csproj
          -c Release
          -r win-x86
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/NavBR.Client.Single

      - name: Publish multiplayer simulator standalone win-x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.MultiplayerSimulator/NavBR.MultiplayerSimulator.csproj `
            -c Release `
            -r win-x86 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/NavBR.MultiplayerSimulator

          dotnet publish src/NavBR.Server/NavBR.Server.csproj `
            -c Release `
            -r win-x86 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/NavBR.MultiplayerSimulator/server

          foreach ($required in @(
            "artifacts/NavBR.MultiplayerSimulator/NavBR.MultiplayerSimulator.exe",
            "artifacts/NavBR.MultiplayerSimulator/server/NavBR.Server.exe",
            "scripts/run-multiplayer-simulator.ps1",
            "docs/MULTIPLAYER_SIMULATOR.md"
          )) {
            if (-not (Test-Path $required)) {
              throw "Simulator package incomplete: $required"
            }
          }

          Copy-Item "scripts/run-multiplayer-simulator.ps1" `
            "artifacts/NavBR.MultiplayerSimulator/run-multiplayer-simulator.ps1" -Force
          Copy-Item "docs/MULTIPLAYER_SIMULATOR.md" `
            "artifacts/NavBR.MultiplayerSimulator/README-SIMULATOR.md" -Force

          @(
            '@echo off'
            'cd /d "%~dp0"'
            'NavBR.MultiplayerSimulator.exe --server https://omsi-navbr-multiplayer-server.onrender.com --room navbr-sim --players 6 --mode mixed --verify-physical'
            'pause'
          ) | Set-Content -LiteralPath "artifacts/NavBR.MultiplayerSimulator/run-online.cmd" -Encoding ASCII

          @(
            '@echo off'
            'cd /d "%~dp0"'
            'NavBR.MultiplayerSimulator.exe --server http://127.0.0.1:27730 --room navbr-sim --players 6 --mode mixed --verify-physical'
            'pause'
          ) | Set-Content -LiteralPath "artifacts/NavBR.MultiplayerSimulator/run-local.cmd" -Encoding ASCII

      - name: Validate standalone EXE icon resource
        shell: pwsh
        run: |
          $exe = Resolve-Path "artifacts/NavBR.Client.Single/OMSI.NavBR.Multiplayer.exe"
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NavBRIconResourceCheck {
            public delegate bool EnumResNameProc(IntPtr h, IntPtr t, IntPtr n, IntPtr p);
            [DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)]
            public static extern IntPtr LoadLibraryEx(string fileName, IntPtr file, uint flags);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool EnumResourceNames(IntPtr module, IntPtr type, EnumResNameProc callback, IntPtr param);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool FreeLibrary(IntPtr module);
          }
          "@
          $module = [NavBRIconResourceCheck]::LoadLibraryEx($exe.Path, [IntPtr]::Zero, 0x00000002)
          if ($module -eq [IntPtr]::Zero) { throw "Could not inspect standalone EXE icon resources." }
          try {
            $script:iconGroups = 0
            $callback = [NavBRIconResourceCheck+EnumResNameProc]{
              param([IntPtr]$h,[IntPtr]$t,[IntPtr]$n,[IntPtr]$p)
              $script:iconGroups++
              return $true
            }
            $null = [NavBRIconResourceCheck]::EnumResourceNames($module, [IntPtr]14, $callback, [IntPtr]::Zero)
            if ($script:iconGroups -lt 1) { throw "Standalone EXE has no RT_GROUP_ICON resource." }
            Write-Host "Standalone EXE icon resource confirmed."
          }
          finally { [NavBRIconResourceCheck]::FreeLibrary($module) | Out-Null }

      - name: Prepare current integration test bundle
        shell: pwsh
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $group = @($props.Project.PropertyGroup) | Where-Object { $_.VersionPrefix } | Select-Object -First 1
          $prefix = [string]$group.VersionPrefix
          $suffix = [string]$group.VersionSuffix
          $version = if ([string]::IsNullOrWhiteSpace($suffix)) { $prefix } else { "$prefix-$suffix" }

          $bundle = "artifacts/NavBR.IntegrationTest"
          $pluginBundle = Join-Path $bundle "Plugin"
          if (Test-Path $bundle) { Remove-Item $bundle -Recurse -Force }
          New-Item -ItemType Directory -Path $pluginBundle -Force | Out-Null
          $simulatorBundle = Join-Path $bundle "Simulator"
          New-Item -ItemType Directory -Path $simulatorBundle -Force | Out-Null
          Copy-Item "artifacts/NavBR.Client.Single/OMSI.NavBR.Multiplayer.exe" $bundle
          Copy-Item "artifacts/NavBR.OmsiPlugin.Experimental/*" $pluginBundle -Recurse -Force
          Copy-Item "artifacts/NavBR.MultiplayerSimulator/*" $simulatorBundle -Recurse -Force
          Copy-Item "docs/OMSI_PLUGIN_EXPERIMENTAL.md" (Join-Path $bundle "PLUGIN-TEST.md")
          @(
            "OMSI NavBR Multiplayer $version - integration test build"
            "GitHub SHA: $env:GITHUB_SHA"
            "Generated UTC: $([DateTimeOffset]::UtcNow.ToString('O'))"
            ""
            "React/WebView2 UI: built from ui/navbr-web for this commit."
            "Plugin Native AOT x86: embedded in the client and included separately in Plugin/."
            "Player simulator: standalone win-x86 included in Simulator/."
          ) | Set-Content -LiteralPath (Join-Path $bundle "BUILD-INFO.txt") -Encoding UTF8

      - name: Upload NavBR client test build
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-NavBR-Multiplayer-win-x86
          path: artifacts/NavBR.Client
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone NavBR EXE
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-NavBR-Multiplayer-standalone-win-x86
          path: artifacts/NavBR.Client.Single/OMSI.NavBR.Multiplayer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload experimental OMSI plugin
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-NavBR-Plugin-experimental-win-x86
          path: artifacts/NavBR.OmsiPlugin.Experimental
          if-no-files-found: error
          retention-days: 14

      - name: Upload multiplayer player simulator
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-NavBR-Multiplayer-Simulator-win-x86
          path: artifacts/NavBR.MultiplayerSimulator
          if-no-files-found: error
          retention-days: 14

      - name: Upload current integration test bundle
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-NavBR-integration-test-win-x86
          path: artifacts/NavBR.IntegrationTest
          if-no-files-found: error
          retention-days: 14
