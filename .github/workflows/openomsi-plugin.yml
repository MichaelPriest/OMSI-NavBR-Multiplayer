name: openOMSI plugin

on:
  push:
    branches: [ main, feature/openomsi-navbr-plugin ]
    paths:
      - 'src/NavBR.OpenOmsiPlugin/**'
      - 'src/NavBR.Shared/OpenOmsi/**'
      - 'src/NavBR.Shared/PluginBridge/**'
      - 'src/NavBR.OpenOmsiLanSmokeTest/**'
      - 'src/NavBR.OpenOmsiGatewaySmokeTest/**'
      - 'src/NavBR.OpenOmsiPluginSmokeTest/**'
      - '.github/workflows/openomsi-plugin.yml'
  pull_request:
    branches: [ main, feature/alpha26-app-polish ]
    paths:
      - 'src/NavBR.OpenOmsiPlugin/**'
      - 'src/NavBR.Shared/PluginBridge/**'
      - '.github/workflows/openomsi-plugin.yml'
  workflow_dispatch:

concurrency:
  group: openomsi-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore openOMSI plugin
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.OpenOmsiLanSmokeTest/NavBR.OpenOmsiLanSmokeTest.csproj
          dotnet restore src/NavBR.OpenOmsiGatewaySmokeTest/NavBR.OpenOmsiGatewaySmokeTest.csproj
          dotnet restore src/NavBR.OpenOmsiPluginSmokeTest/NavBR.OpenOmsiPluginSmokeTest.csproj -r win-x64
          dotnet restore src/NavBR.OpenOmsiPlugin/NavBR.OpenOmsiPlugin.csproj -r win-x64

      - name: Smoke-test openOMSI LAN v6 codec
        shell: pwsh
        run: dotnet run --project src/NavBR.OpenOmsiLanSmokeTest/NavBR.OpenOmsiLanSmokeTest.csproj -c Release --no-restore

      - name: Smoke-test openOMSI loopback gateway
        shell: pwsh
        run: dotnet run --project src/NavBR.OpenOmsiGatewaySmokeTest/NavBR.OpenOmsiGatewaySmokeTest.csproj -c Release --no-restore

      - name: Smoke-test openOMSI phase 1 navigation runtime
        shell: pwsh
        run: dotnet run --project src/NavBR.OpenOmsiPluginSmokeTest/NavBR.OpenOmsiPluginSmokeTest.csproj -c Release -r win-x64 --no-restore

      - name: Publish Native AOT x64 plugin
        shell: pwsh
        run: |
          dotnet publish src/NavBR.OpenOmsiPlugin/NavBR.OpenOmsiPlugin.csproj `
            -c Release `
            -r win-x64 `
            --no-restore `
            -p:PublishAot=true `
            -p:NativeLib=Shared `
            -o artifacts/NavBR.OpenOmsiPlugin

          foreach ($required in @(
            "artifacts/NavBR.OpenOmsiPlugin/NavBR.OpenOmsiPlugin.dll",
            "artifacts/NavBR.OpenOmsiPlugin/NavBR.OpenOmsiPlugin.opl",
            "artifacts/NavBR.OpenOmsiPlugin/main.lua",
            "artifacts/NavBR.OpenOmsiPlugin/Install-NavBROpenOmsiPlugin.ps1",
            "artifacts/NavBR.OpenOmsiPlugin/Remove-NavBROpenOmsiPlugin.ps1",
            "artifacts/NavBR.OpenOmsiPlugin/README.md",
            "artifacts/NavBR.OpenOmsiPlugin/OPENOMSI_OVERLAY_ABI.md",
            "artifacts/NavBR.OpenOmsiPlugin/OPENOMSI_HOST_INTEGRATION.md",
            "artifacts/NavBR.OpenOmsiPlugin/OPENOMSI_WORLD_GUIDANCE_RENDERER.md",
            "artifacts/NavBR.OpenOmsiPlugin/Apply-NavBROpenOmsiHostIntegration.ps1",
            "artifacts/NavBR.OpenOmsiPlugin/patches/README.md",
            "artifacts/NavBR.OpenOmsiPlugin/patches/openomsi-navbr-overlay-loader-v2.patch",
            "artifacts/NavBR.OpenOmsiPlugin/patches/openomsi-navbr-overlay-app-state-v2.patch",
            "artifacts/NavBR.OpenOmsiPlugin/patches/openomsi-navbr-overlay-ui-v2.patch",
            "artifacts/NavBR.OpenOmsiPlugin/patches/openomsi-navbr-world-guidance-stock-fallback-v2.patch",
            "artifacts/NavBR.OpenOmsiPlugin/patches/openomsi-navbr-world-guidance-mesh-v2.patch"
          )) {
            if (-not (Test-Path $required)) {
              throw "openOMSI package incomplete: $required"
            }
          }

      - name: Validate standard OMSI ABI
        shell: pwsh
        run: |
          $dll = Resolve-Path "artifacts/NavBR.OpenOmsiPlugin/NavBR.OpenOmsiPlugin.dll"
          $bytes = [System.IO.File]::ReadAllBytes($dll.Path)
          if ([BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) {
            throw "Plugin is not PE/MZ."
          }
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550) {
            throw "Plugin has invalid PE signature."
          }
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x8664) {
            throw ("Plugin must be x64/AMD64; machine=0x{0:X4}" -f $machine)
          }

          $exports = (& dumpbin /nologo /exports $dll.Path) -join "`n"
          foreach ($name in @(
            'PluginStart',
            'PluginFinalize',
            'AccessVariable',
            'AccessTrigger',
            'AccessStringVariable',
            'AccessSystemVariable'
          )) {
            if ($exports -notmatch "(?m)\b$([regex]::Escape($name))\b") {
              throw "Plugin is missing standard OMSI export: $name"
            }
          }

          if ($exports -notmatch "(?m)\bOpenOmsiGetOverlayFrame\b") {
            throw "Plugin is missing openOMSI optional overlay export: OpenOmsiGetOverlayFrame"
          }
          if ($exports -notmatch "(?m)\bOpenOmsiGetOverlayFrameV2\b") {
            throw "Plugin is missing openOMSI optional overlay export: OpenOmsiGetOverlayFrameV2"
          }
          if ($exports -notmatch "(?m)\bOpenOmsiSetHudFlagsV1\b") {
            throw "Plugin is missing openOMSI optional HUD control export: OpenOmsiSetHudFlagsV1"
          }

          $lua = Get-Content "artifacts/NavBR.OpenOmsiPlugin/main.lua" -Raw
          foreach ($requiredLuaApi in @(
            'omsi.position()',
            'omsi.info()',
            'omsi.others(',
            'omsi.other_var(',
            'omsi.save()',
            'info.trips',
            'info.next_stop_number',
            'omsi.every(0.25'
          )) {
            if (-not $lua.Contains($requiredLuaApi)) {
              throw "Lua companion is missing documented openOMSI API usage: $requiredLuaApi"
            }
          }

          $opl = Get-Content "artifacts/NavBR.OpenOmsiPlugin/NavBR.OpenOmsiPlugin.opl" -Raw
          if ($opl -notmatch '(?i)\[dll\]\s*NavBR\.OpenOmsi\\NavBR\.OpenOmsiPlugin\.dll') {
            throw "OPL DLL path is not relative to the openOMSI Plugins root."
          }

      - name: Validate host patches against pinned openOMSI
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP "openOMSI-upstream"
          if (Test-Path $upstream) {
            Remove-Item $upstream -Recurse -Force
          }

          git clone --filter=blob:none https://github.com/openOMSI-Project/openOMSI.git $upstream
          Push-Location $upstream
          git checkout 100f7f6a2322f3b35207694850a7a4970fe0bb17
          Pop-Location

          $apply = Resolve-Path "src/NavBR.OpenOmsiPlugin/Apply-NavBROpenOmsiHostIntegration.ps1"
          & $apply -OpenOmsiSource $upstream -WorldGuidanceRenderer stock

          Push-Location $upstream
          cargo check -p omsi-plugin -p omsi-app
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "Patched openOMSI stock-guidance host did not compile."
          }

          git reset --hard 100f7f6a2322f3b35207694850a7a4970fe0bb17
          git clean -fd
          Pop-Location

          & $apply -OpenOmsiSource $upstream -WorldGuidanceRenderer mesh

          Push-Location $upstream
          cargo check -p omsi-plugin -p omsi-app
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "Patched openOMSI mesh-guidance host did not compile."
          }

          cargo build --locked --release --target x86_64-pc-windows-msvc -p omsi-app
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "Patched openOMSI NavBR host release build failed."
          }

          $hostArtifact = Join-Path $env:GITHUB_WORKSPACE "artifacts\NavBR.OpenOmsiHost"
          New-Item -ItemType Directory -Path $hostArtifact -Force | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\openomsi.exe" (Join-Path $hostArtifact "openomsi.exe") -Force
          Copy-Item "assets\steam_redist\steam_api64.dll" (Join-Path $hostArtifact "steam_api64.dll") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "src\NavBR.OpenOmsiPlugin\Install-NavBROpenOmsiHost.ps1") (Join-Path $hostArtifact "Install-NavBROpenOmsiHost.ps1") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "src\NavBR.OpenOmsiPlugin\Restore-OriginalOpenOmsiHost.ps1") (Join-Path $hostArtifact "Restore-OriginalOpenOmsiHost.ps1") -Force
          Pop-Location

          @(
            "NavBR enhanced openOMSI host - TEST BUILD",
            "",
            "Upstream openOMSI: 100f7f6a2322f3b35207694850a7a4970fe0bb17",
            "World guidance renderer: mesh",
            "",
            "Use with the NavBR openOMSI plugin artifact from the same workflow run.",
            "The correct entry point remains openomsi.exe.",
            "Run Install-NavBROpenOmsiHost.ps1 against the existing openOMSI folder.",
            "The installer backs up the original executable as openomsi.navbr-original.exe and replaces openomsi.exe with this NavBR test host.",
            "Start openomsi.exe normally and use Ctrl+Alt+N to open the NavBR panel.",
            "Esc closes the NavBR panel first.",
            "Run Restore-OriginalOpenOmsiHost.ps1 to restore the original executable."
          ) | Set-Content -LiteralPath (Join-Path $hostArtifact "README-NAVBR-HOST-TEST.txt") -Encoding UTF8

      - name: Smoke-test content-root install and removal
        shell: pwsh
        run: |
          $fakeRoot = Join-Path $env:RUNNER_TEMP "NavBR-openOMSI-Plugin-CI"
          if (Test-Path $fakeRoot) {
            Remove-Item $fakeRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $fakeRoot -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $fakeRoot ".openomsi-content") `
            -Value "openOMSI CI content root" -Encoding UTF8

          $package = Resolve-Path "artifacts/NavBR.OpenOmsiPlugin"
          & (Join-Path $package "Install-NavBROpenOmsiPlugin.ps1") -OpenOmsiRoot $fakeRoot

          $target = Join-Path $fakeRoot "Plugins\NavBR.OpenOmsi"
          foreach ($required in @(
            (Join-Path $target "NavBR.OpenOmsiPlugin.dll"),
            (Join-Path $target "NavBR.OpenOmsiPlugin.opl"),
            (Join-Path $target "main.lua"),
            (Join-Path $target "NavBR.OpenOmsiPlugin.install-manifest.txt")
          )) {
            if (-not (Test-Path $required)) {
              throw "Installer did not create: $required"
            }
          }

          $manifest = Get-Content (Join-Path $target "NavBR.OpenOmsiPlugin.install-manifest.txt") -Raw
          if ($manifest -notmatch 'Native AOT win-x64') {
            throw "Manifest does not identify the x64 Native AOT deployment."
          }

          & (Join-Path $package "Remove-NavBROpenOmsiPlugin.ps1") -OpenOmsiRoot $fakeRoot

          foreach ($removed in @(
            (Join-Path $target "NavBR.OpenOmsiPlugin.dll"),
            (Join-Path $target "NavBR.OpenOmsiPlugin.opl"),
            (Join-Path $target "main.lua"),
            (Join-Path $target "NavBR.OpenOmsiPlugin.install-manifest.txt")
          )) {
            if (Test-Path $removed) {
              throw "Remover left file behind: $removed"
            }
          }

          Remove-Item $fakeRoot -Recurse -Force

      - name: Smoke-test NavBR host install and restore
        shell: pwsh
        run: |
          $fakeRoot = Join-Path $env:RUNNER_TEMP "NavBR-openOMSI-Host-CI"
          if (Test-Path $fakeRoot) {
            Remove-Item $fakeRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $fakeRoot -Force | Out-Null
          [System.IO.File]::WriteAllBytes((Join-Path $fakeRoot "openomsi.exe"), [byte[]](1,2,3,4))
          $package = Resolve-Path "artifacts/NavBR.OpenOmsiHost"
          & (Join-Path $package "Install-NavBROpenOmsiHost.ps1") -OpenOmsiRoot $fakeRoot

          $backup = Join-Path $fakeRoot "openomsi.navbr-original.exe"
          $manifest = Join-Path $fakeRoot ".navbr-openomsi-host-test"
          if (-not (Test-Path $backup)) { throw "Host installer did not create backup." }
          if (-not (Test-Path $manifest)) { throw "Host installer did not create manifest." }
          if ((Get-Item (Join-Path $fakeRoot "openomsi.exe")).Length -le 4) {
            throw "Host installer did not replace openomsi.exe."
          }

          & (Join-Path $package "Restore-OriginalOpenOmsiHost.ps1") -OpenOmsiRoot $fakeRoot
          $restored = [System.IO.File]::ReadAllBytes((Join-Path $fakeRoot "openomsi.exe"))
          if ($restored.Length -ne 4 -or $restored[0] -ne 1 -or $restored[3] -ne 4) {
            throw "Host restore did not restore the original openomsi.exe."
          }
          if (Test-Path $backup) { throw "Host restore left backup behind." }
          if (Test-Path $manifest) { throw "Host restore left manifest behind." }

          Remove-Item $fakeRoot -Recurse -Force

      - name: Upload NavBR openOMSI host test
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-NavBR-OpenOMSI-Host-win-x64
          path: artifacts/NavBR.OpenOmsiHost
          if-no-files-found: error
          retention-days: 14
      - name: Upload openOMSI plugin
        uses: actions/upload-artifact@v4
        with:
          name: OMSI-NavBR-OpenOMSI-Plugin-win-x64
          path: artifacts/NavBR.OpenOmsiPlugin
          if-no-files-found: error
          retention-days: 14
