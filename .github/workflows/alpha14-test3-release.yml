name: alpha14 test3 roleplay prerelease

on:
  push:
    branches:
      - test/alpha14-test3

permissions:
  contents: write
  actions: write

concurrency:
  group: alpha14-test3-roleplay-release
  cancel-in-progress: true

jobs:
  publish-test-release:
    runs-on: windows-latest
    env:
      TEST_TAG: v0.3.0-alpha.14-test.3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Alpha.14 Test 3 version
        shell: pwsh
        run: |
          [xml]$props = Get-Content "Directory.Build.props"
          $group = @($props.Project.PropertyGroup) | Where-Object { $_.VersionPrefix } | Select-Object -First 1
          $tag = "v$([string]$group.VersionPrefix)-$([string]$group.VersionSuffix)"
          if ($tag -ne $env:TEST_TAG) { throw "Unexpected version/tag: $tag" }

      - name: Reserve Alpha.14 Test 3 as draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TEST_TAG --repo "${{ github.repository }}" --json tagName,isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $global:LASTEXITCODE = 0
            gh release create $env:TEST_TAG `
              --repo "${{ github.repository }}" `
              --target "$env:GITHUB_SHA" `
              --title "OMSI NavBR Multiplayer $env:TEST_TAG — build validation" `
              --notes "Draft reservado enquanto a Alpha.14 Test 3 passa pela validação automática." `
              --prerelease --draft
            if ($LASTEXITCODE -ne 0) { throw "Could not reserve Alpha.14 Test 3 draft." }
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Generate NavBR icon
        shell: pwsh
        run: .\scripts\repair-navbr-icon.ps1

      - name: Validate XAML and site JavaScript
        shell: pwsh
        run: |
          .\scripts\validate-xaml-colors.ps1
          node --check site/app.js
          node --check site/modern.js

      - name: Build OMSI native interop x86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "artifacts/interop" | Out-Null
          cl /nologo /LD /O2 /EHsc /DWIN32_LEAN_AND_MEAN `
            native/NavBR.OmsiInterop/NavBROmsiInterop.cpp `
            native/NavBR.OmsiInterop/NavBROmsiInteropState.cpp `
            /link /DEF:native/NavBR.OmsiInterop/NavBROmsiInterop.def `
            /OUT:artifacts/interop/NavBR.OmsiInterop.dll
          if ($LASTEXITCODE -ne 0) { throw "Native OMSI interop build failed." }

          $exports = (& dumpbin /nologo /exports "artifacts/interop/NavBR.OmsiInterop.dll") -join "`n"
          foreach ($expected in @(
            "NavBR_GetAbiVersion",
            "NavBR_GetStateInteropVersion",
            "NavBR_GetRoadVehicleCount",
            "NavBR_GetRoadVehicleAt",
            "NavBR_IsRoadVehiclePointer",
            "NavBR_GetHumanCount",
            "NavBR_GetHumanAt",
            "NavBR_IsHumanPointer",
            "NavBR_IsPlayerBusDriverHuman",
            "NavBR_ReadHumanPose",
            "NavBR_ReadHumanDriverState",
            "NavBR_DetachHumanForRoleplay",
            "NavBR_SetHumanTransform",
            "NavBR_RestoreHumanAiState",
            "NavBR_RestoreHumanDriverState",
            "NavBR_MakeVehicle",
            "NavBR_SetVehicleTransform",
            "NavBR_SetVehicleVisualState",
            "NavBR_MarkVehicleForKilling"
          )) {
            if ($exports -notmatch "(?m)\b$([regex]::Escape($expected))\b") {
              throw "Missing native OMSI interop export: $expected"
            }
          }

      - name: Restore projects
        shell: pwsh
        run: |
          dotnet restore src/NavBR.Shared/NavBR.Shared.csproj
          dotnet restore src/NavBR.Server/NavBR.Server.csproj
          dotnet restore src/NavBR.Client/NavBR.Client.csproj -r win-x86
          dotnet restore src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj -r win-x86
          dotnet restore src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj -r win-x86
          dotnet restore src/NavBR.MultiplayerSimulator/NavBR.MultiplayerSimulator.csproj

      - name: Build shared and server
        shell: pwsh
        run: |
          dotnet build src/NavBR.Shared/NavBR.Shared.csproj -c Release --no-restore
          dotnet build src/NavBR.Server/NavBR.Server.csproj -c Release --no-restore
          dotnet build src/NavBR.MultiplayerSimulator/NavBR.MultiplayerSimulator.csproj -c Release --no-restore
      - name: Verify simulated players moving through the room
        shell: pwsh
        run: |
          $server = Start-Process dotnet -PassThru -WindowStyle Hidden -ArgumentList @(
            "run", "--project", "src/NavBR.Server/NavBR.Server.csproj",
            "-c", "Release", "--no-build", "--",
            "--urls", "http://127.0.0.1:27831"
          )
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-WebRequest "http://127.0.0.1:27831/health" -UseBasicParsing -TimeoutSec 2
                if ($health.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw "NavBR Test 3 server did not become ready." }

            dotnet run --project src/NavBR.MultiplayerSimulator/NavBR.MultiplayerSimulator.csproj `
              -c Release --no-build -- `
              --server http://127.0.0.1:27831 `
              --room alpha14-test3-ci `
              --players 8 --mode mixed `
              --map "Alpha14 Test 3 CI" `
              --radius 70 --interval 200 --duration 9 --verify
            if ($LASTEXITCODE -ne 0) { throw "Test 3 movement simulation failed." }
          }
          finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Publish Native AOT OMSI plugin x86
        shell: pwsh
        run: |
          dotnet publish src/NavBR.OmsiPluginExperimental/NavBR.OmsiPluginExperimental.csproj `
            -c Release -r win-x86 --no-restore `
            -p:PublishAot=true -p:NativeLib=Shared `
            -o artifacts/plugin
          Copy-Item "artifacts/interop/NavBR.OmsiInterop.dll" "artifacts/plugin/NavBR.OmsiInterop.dll" -Force
          foreach ($required in @(
            "artifacts/plugin/NavBR.OmsiPlugin.dll",
            "artifacts/plugin/NavBR.OmsiInterop.dll",
            "artifacts/plugin/NavBR.OmsiPlugin.opl",
            "artifacts/plugin/Install-NavBROmsiPlugin.ps1",
            "artifacts/plugin/Remove-NavBROmsiPlugin.ps1"
          )) {
            if (-not (Test-Path $required)) { throw "Plugin package incomplete: $required" }
          }

      - name: Validate plugin binaries are x86
        shell: pwsh
        run: |
          foreach ($candidate in @("artifacts/plugin/NavBR.OmsiPlugin.dll","artifacts/plugin/NavBR.OmsiInterop.dll")) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $candidate).Path)
            if ([BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) { throw "$candidate is not PE/MZ." }
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne 0x014C) { throw ("$candidate must be x86; machine=0x{0:X4}" -f $machine) }
          }

      - name: Embed and verify plugin inside client
        shell: pwsh
        run: |
          .\scripts\prepare-embedded-plugin.ps1 `
            -PluginDirectory "artifacts/plugin" `
            -OutputPath "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $bundle = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "src/NavBR.Client/Assets/NavBR.OmsiPlugin.bundle.zip"))
          try {
            $names = @($bundle.Entries | ForEach-Object { $_.Name })
            foreach ($required in @("NavBR.OmsiPlugin.dll","NavBR.OmsiInterop.dll","NavBR.OmsiPlugin.opl")) {
              if ($names -notcontains $required) { throw "Embedded plugin missing: $required" }
            }
          }
          finally {
            $bundle.Dispose()
          }

      - name: Build client
        shell: pwsh
        run: dotnet build src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --no-restore

      - name: Smoke-test bridge v3
        shell: pwsh
        run: |
          dotnet publish src/NavBR.PluginBridgeSmokeTest/NavBR.PluginBridgeSmokeTest.csproj `
            -c Release -r win-x86 --self-contained true --no-restore `
            -o artifacts/bridge-smoke
          & "artifacts/bridge-smoke/NavBR.PluginBridgeSmokeTest.exe"
          if ($LASTEXITCODE -ne 0) { throw "Plugin bridge smoke test failed." }

      - name: Publish client and standalone EXE
        shell: pwsh
        run: |
          dotnet publish src/NavBR.Client/NavBR.Client.csproj -c Release -r win-x86 --self-contained true -o artifacts/client
          dotnet publish src/NavBR.Client/NavBR.Client.csproj `
            -c Release -r win-x86 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o artifacts/client-single

      - name: Publish dedicated server
        shell: pwsh
        run: dotnet publish src/NavBR.Server/NavBR.Server.csproj -c Release -r win-x64 --self-contained true -o artifacts/server

      - name: Publish multiplayer simulator dev tool
        shell: pwsh
        run: dotnet publish src/NavBR.MultiplayerSimulator/NavBR.MultiplayerSimulator.csproj -c Release -r win-x64 --self-contained true -o artifacts/simulator

      - name: Prepare Alpha.14 Test 3 assets and notes
        shell: pwsh
        run: |
          $releaseDir = "artifacts/release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          foreach ($target in @("artifacts/client","artifacts/server","artifacts/plugin","artifacts/simulator")) {
            Copy-Item LICENSE (Join-Path $target "LICENSE") -Force
            Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $target "THIRD_PARTY_NOTICES.md") -Force
          }

          $standalone = "artifacts/client-single/OMSI.NavBR.Multiplayer.exe"
          if (-not (Test-Path $standalone)) { throw "Standalone client missing." }
          Copy-Item $standalone (Join-Path $releaseDir "OMSI-NavBR-Multiplayer-$env:TEST_TAG-win-x86.exe") -Force
          Compress-Archive -Path "artifacts/client/*" -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-Multiplayer-$env:TEST_TAG-win-x86.zip") -Force
          Compress-Archive -Path "artifacts/server/*" -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-Server-$env:TEST_TAG-win-x64.zip") -Force
          Compress-Archive -Path "artifacts/plugin/*" -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-Plugin-$env:TEST_TAG-win-x86.zip") -Force
          Compress-Archive -Path "artifacts/simulator/*" -DestinationPath (Join-Path $releaseDir "OMSI-NavBR-Multiplayer-Simulator-$env:TEST_TAG-win-x64-dev.zip") -Force

          Copy-Item docs/ALPHA14_TEST3_COMMUNITY.md (Join-Path $releaseDir "ALPHA14_TEST3_COMMUNITY.md") -Force
          Copy-Item docs/ALPHA14_TEST3_RELEASE_NOTES.md (Join-Path $releaseDir "ALPHA14_TEST3_RELEASE_NOTES.md") -Force
          Copy-Item docs/ALPHA14_MASTER_SCOPE.md (Join-Path $releaseDir "ALPHA14_MASTER_SCOPE.md") -Force
          Copy-Item docs/MULTIPLAYER_SIMULATOR.md (Join-Path $releaseDir "MULTIPLAYER_SIMULATOR.md") -Force
          Copy-Item docs/OMSI_PLUGIN_EXPERIMENTAL.md (Join-Path $releaseDir "OMSI_PLUGIN_EXPERIMENTAL.md") -Force
          Copy-Item docs/HARDWARE_COCKPIT.md (Join-Path $releaseDir "HARDWARE_COCKPIT.md") -Force
          Copy-Item LICENSE (Join-Path $releaseDir "LICENSE") -Force
          Copy-Item THIRD_PARTY_NOTICES.md (Join-Path $releaseDir "THIRD_PARTY_NOTICES.md") -Force

          $hashLines = foreach ($file in Get-ChildItem $releaseDir -File | Sort-Object Name) {
            if ($file.Name -eq "SHA256SUMS.txt") { continue }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $hashLines | Set-Content (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ascii

          Copy-Item docs/ALPHA14_TEST3_RELEASE_NOTES.md "artifacts/release-notes.md" -Force


      - name: Clean incomplete release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseId = gh release view $env:TEST_TAG --repo "${{ github.repository }}" --json databaseId --jq .databaseId
          if (-not $releaseId) { throw "Could not resolve draft release id." }
          $existing = gh api "repos/${{ github.repository }}/releases/$releaseId/assets?per_page=100" | ConvertFrom-Json
          foreach ($asset in @($existing)) {
            Write-Host "Removing previous asset $($asset.name) state=$($asset.state)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$($asset.id)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not remove old asset $($asset.name)." }
          }

      - name: Upload release assets sequentially
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseId = gh release view $env:TEST_TAG --repo "${{ github.repository }}" --json databaseId --jq .databaseId
          if (-not $releaseId) { throw "Could not resolve draft release id." }

          $assets = Get-ChildItem "artifacts/release" -File | Sort-Object Length, Name
          foreach ($asset in $assets) {
            $encodedName = [uri]::EscapeDataString($asset.Name)
            $uploadUrl = "https://uploads.github.com/repos/${{ github.repository }}/releases/$releaseId/assets?name=$encodedName"
            $contentType = switch -Regex ($asset.Extension) {
              '^\.exe$' { 'application/x-msdownload'; break }
              '^\.zip$' { 'application/zip'; break }
              '^\.txt$' { 'text/plain'; break }
              default { 'application/octet-stream' }
            }

            $uploaded = $false
            for ($attempt = 1; $attempt -le 3 -and -not $uploaded; $attempt++) {
              Write-Host "Uploading $($asset.Name) attempt $attempt/3 ($([math]::Round($asset.Length / 1MB, 1)) MiB)"
              & curl.exe --silent --show-error --fail-with-body `
                --retry 2 --retry-delay 3 --retry-all-errors `
                --connect-timeout 30 --max-time 600 `
                -X POST `
                -H "Accept: application/vnd.github+json" `
                -H "Authorization: Bearer $env:GH_TOKEN" `
                -H "X-GitHub-Api-Version: 2022-11-28" `
                -H "Content-Type: $contentType" `
                --data-binary "@$($asset.FullName)" `
                $uploadUrl | Out-Null

              if ($LASTEXITCODE -eq 0) {
                $uploaded = $true
              }
              else {
                $global:LASTEXITCODE = 0
                Start-Sleep -Seconds (5 * $attempt)
                $existing = gh api "repos/${{ github.repository }}/releases/$releaseId/assets?per_page=100" | ConvertFrom-Json
                $stale = @($existing) | Where-Object { $_.name -eq $asset.Name } | Select-Object -First 1
                if ($stale) {
                  gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$($stale.id)" | Out-Null
                  $global:LASTEXITCODE = 0
                }
              }
            }

            if (-not $uploaded) { throw "Failed to upload release asset $($asset.Name) after retries." }
          }

      - name: Verify and publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseId = gh release view $env:TEST_TAG --repo "${{ github.repository }}" --json databaseId --jq .databaseId
          $assets = gh api "repos/${{ github.repository }}/releases/$releaseId/assets?per_page=100" | ConvertFrom-Json
          $required = @(
            "OMSI-NavBR-Multiplayer-$env:TEST_TAG-win-x86.exe",
            "OMSI-NavBR-Multiplayer-$env:TEST_TAG-win-x86.zip",
            "OMSI-NavBR-Server-$env:TEST_TAG-win-x64.zip",
            "OMSI-NavBR-Plugin-$env:TEST_TAG-win-x86.zip",
            "OMSI-NavBR-Multiplayer-Simulator-$env:TEST_TAG-win-x64-dev.zip",
            "SHA256SUMS.txt"
          )
          foreach ($name in $required) {
            $asset = @($assets) | Where-Object { $_.name -eq $name -and $_.state -eq 'uploaded' } | Select-Object -First 1
            if (-not $asset) { throw "Required release asset is not fully uploaded: $name" }
          }

          gh release edit $env:TEST_TAG `
            --repo "${{ github.repository }}" `
            --target "$env:GITHUB_SHA" `
            --title "OMSI NavBR Multiplayer $env:TEST_TAG — Central Multiplayer + RP v3" `
            --notes-file "artifacts/release-notes.md" `
            --prerelease --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish $env:TEST_TAG." }

      - name: Refresh GitHub Pages release catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
