name: Sugerir uma melhoria
description: Envie uma ideia para melhorar o NavBR, HUD, navegação, multiplayer ou site.
title: "[Sugestão] "
body:
  - type: markdown
    attributes:
      value: |
        Ideias da comunidade ajudam a definir as próximas versões do NavBR.

  - type: dropdown
    id: area
    attributes:
      label: Área da sugestão
      options:
        - HUD / minimapa
        - Traçado / navegação
        - Chat
        - Voz / PTT
        - Multiplayer
        - Interface do aplicativo
        - Instalação / atualização
        - Site / downloads
        - Outro
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Qual é a ideia?
      description: Explique o recurso ou melhoria desejada.
      placeholder: Descreva a sugestão.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Como isso melhoraria a experiência?
      placeholder: Conte em que situação esse recurso seria útil.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: Referências visuais ou exemplos
      description: Você pode arrastar imagens, mockups ou links de referência aqui. Não envie conteúdo que não possa ser compartilhado publicamente.

  - type: checkboxes
    id: scope
    attributes:
      label: Escopo
      options:
        - label: Entendo que a sugestão pode ser adaptada para manter a identidade própria do NavBR.
          required: true
